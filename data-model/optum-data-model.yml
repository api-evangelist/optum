notes: Optum has no single object model. Each of the eight developer.optum.com product lines — eligibility and claims,
  Optum Real medical, Optum Real dental, pharmacy solutions, payment and reimbursement, analytics and insights,
  platform and interoperability, and API tools — ships its own component schema set, and the FHIR surfaces (Real
  Prior Authorization, Real Provider Access) follow HL7 FHIR R4 / Da Vinci profiles rather than an Optum-proprietary
  model. The entity graph below is therefore a UNION of independent models, not one domain. What actually joins
  them are a handful of identifiers that recur across product lines.
cross_api_identifiers:
- id: payerId
  meaning: Optum/Change Healthcare payer identifier; resolvable through the Payer List API
  used_by:
  - getPayers
  - claimstatus
  - medicalEligibility
  - getQuestionnairePackage
  - bulkMemberMatch
- id: tradingPartnerServiceId
  meaning: X12 trading-partner service identifier for the destination payer
  used_by:
  - medicalEligibility
  - processClaim
  - claimstatus
- id: controlNumber
  meaning: X12 interchange/transaction control number echoed on responses
  used_by:
  - medicalEligibility
  - processClaim
  - claimstatus
- id: traceId
  meaning: Attachment submission trace identifier used to poll status
  used_by:
  - upload
  - GET /{traceId}
- id: attachmentId
  meaning: Dental and medical attachment identifier
  used_by:
  - CreateAttachment
  - AddAttachment
  - CommitAttachment
  - GetAttachmentbyId
- id: lob
  meaning: Line of business path segment on every FHIR Da Vinci operation
  used_by:
  - getPasCapabilityStatement
  - submitClaim
  - bulkMemberMatch
- id: submitterId / senderId / billerId
  meaning: Submitter identity echoed for troubleshooting; documented on the metadata troubleshooting page
  used_by:
  - processClaim
  - upload
