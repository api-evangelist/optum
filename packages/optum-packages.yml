summary: >-
  Optum publishes NO first-party client library for any of the healthcare transaction APIs on
  developer.optum.com. The 59 OpenAPI documents harvested into openapi/ are consumed directly over
  HTTPS with an OAuth2 client-credentials bearer token; the docs' only code artifacts are the
  ReadMe "Try It" console and copy-paste curl snippets. The @optum npm scope IS first-party (it maps
  to github.com/Optum, 88 public repositories), but everything published under it is internal
  engineering tooling that Optum open-sourced — Kafka clients, React hooks, an OIDC relying-party
  server, a JSON Schema editor — not a client for the eligibility/claims/FHIR APIs. That distinction
  is the finding: a large, active open-source org next to an API platform with zero SDK coverage.
