scheme: >-
  Per-API major version in the URI path (v1/v2/v3). There is no single platform changelog and no
  semantic versioning; each API carries its own "Release Notes" page under the ReadMe docs project,
  and superseded majors are marked deprecated on that page rather than through Sunset headers.
