notes: >-
  The change history is fragmented across four ReadMe docs projects (eligibilityandclaims,
  optumreal-medical, optumreal-dental, apitools) and is not dated consistently — several entries
  carry only a month. There is no RSS/Atom feed for API changes; the only machine-readable dated
  feed Optum operates is the incident history on status.optum.com.
