                  certificationIssueDate:
                    example: 2020/01/01
                    type: string
                  clientName:
                    example: Client Name
                    type: string
                  dependentDob:
                    example: 2002/01/01
                    type: string
                  dependentFirstName:
                    example: EFG
                    type: string
                  dependentIdNum:
                    example: '02'
                    type: string
                  paActionOutcomeCode:
                    example: A
                    type: string
                  paEndDate:
                    example: 2020/01/31
