                    type: integer
                  profUnitRequestedCount:
                    example: 2
                    type: integer
                  provNpi:
                    example: '25252'
                    type: string
                  provZipCode:
                    example: 123V45
                    type: string
                  serviceLineAmount:
                    example: 10.5
                    type: string
                  subscriberDob:
                    example: 2001/01/01
                    type: string
                  subscriberFirstName:
                    example: ABC
                    type: string
                  subscriberIdNum:
                    example: '92929244'
                    type: string
                  subscriberLastOrgName:
                    example: XYZ
                    type: string
                  vendorId:
                    example: 2
                    type: integer
                  vendorZcodeField:
                    example: Z20203
                    type: string
                type: object
              look_up:
                example: Prior-Auth
                type: string
              params:
                properties:
                  memberId:
                    example: M0000058
                    type: string
                  payerId:
                    example: '9060'
                    type: string
                  vendorId:
                    example: '2'
                    type: string
                type: object
              ruleSet:
                example: 1
                type: integer
            type: object
      description: payload for priorauthdata API
      required: true
