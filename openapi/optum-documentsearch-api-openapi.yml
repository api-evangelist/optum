      - documentSearch
components:
  schemas:
    SearchResults:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/Result'
    PrincipalCareProviderId:
      type: object
      properties:
        extension:
          type: string
        root:
          type: string
        assigningAuthorityName:
          type: string
    DeceasedTime:
      type: object
      properties:
        value:
          type: string
    Authorization:
      type: object
      required:
      - tenantOid
      - organizationId
      - clientId
      - purposeOfUse
      properties:
        purposeOfUse:
          type: string
        tenantOid:
          type: string
        subjectId:
          type: string
        role:
          type: string
        organizationId:
          type: string
        clientId:
          type: string
        clientUUId:
          type: string
    Address:
      type: object
      properties:
        postalCode:
          type: string
        streetAddressLine:
          type: string
        state:
          type: string
        use:
          type: string
        city:
          type: string
        country:
          type: string
    Documents:
      type: object
      properties:
        document:
          type: array
          items:
            $ref: '#/components/schemas/Document'
    DocumentSearchResponse:
      properties:
        searchResults:
          $ref: '#/components/schemas/SearchResults'
        responseStatus:
          $ref: '#/components/schemas/ResponseStatus'
    PatientInformation:
      type: object
      properties:
        id:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        patientPerson:
          $ref: '#/components/schemas/PatientPerson'
        classCode:
          type: string
    Birthplace:
      type: object
      properties:
        place:
          $ref: '#/components/schemas/Place'
    LivingSubjectTelecommunication:
      type: array
      items:
        $ref: '#/components/schemas/Phone'
    LivingSubjectName:
      type: object
      properties:
        given:
          type: array
          items:
            $ref: '#/components/schemas/Given'
        family:
          type: string
        prefix:
          type: string
        use:
          type: string
          description: Supported values L, Null Flavor=NAV for, ASGN, A, I, C, ASGN, R, ASGN, Null Flavor=NAV, Null Flavor=UNK
        suffix:
          type: string
    ResponseStatus:
      type: object
      properties:
        responseState:
          type: string
        responseCode:
          type: string
        responseCodeDescription:
          type: string
        message:
          type: string
    PatientDemographics:
      type: object
