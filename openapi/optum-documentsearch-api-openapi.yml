        livingSubjectDeceasedTime:
          type: string
        livingSubjectId:
          type: array
          items:
            $ref: '#/components/schemas/LivingSubjectId'
        principalCareProviderId:
          $ref: '#/components/schemas/PrincipalCareProviderId'
    DocumentSearchRequest:
      type: object
      description: Request object model for document search.
      properties:
