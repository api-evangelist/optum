        livingSubjectBirthTime:
          type: string
        livingSubjectAddress:
          $ref: '#/components/schemas/LivingSubjectAddress'
        livingSubjectBirthPlaceAddress:
          $ref: '#/components/schemas/Address'
        livingSubjectTelecommunication:
          $ref: '#/components/schemas/LivingSubjectTelecommunication'
        livingSubjectMothersMaidenName:
