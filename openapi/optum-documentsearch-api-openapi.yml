openapi: 3.2.0
info:
  title: Cross Community Rest APIs(XC-Rest) Document Search API
  version: '1.49'
  description: Documentation for Cross Community API to query and retrieve patient data.
  contact:
    email: odx_ncc_foundation@optum.com
    name: ODX/NCC Foundation Team
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://gateway-nonprod.optuminsightplatform.com/odxcloudxcservicesint
  variables: {}
  description: XC-Rest APIs Internal Server(INT)
tags:
- name: documentSearch
paths:
  /api/xc/v1/clinical/documents/search:
    summary: Patient Document Search API
    description: Performs patient search, and also searches for the patient's clinical documents if the patient is found.
    post:
      summary: Search patient document
      description: Search patient document based on the search criteria.
      operationId: documentSearch
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: 'DocumentSearchRequest: request object that contains patient information used for patient search.'
