        '401':
          description: Response when the missing token/token is expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpClientServerError'
              examples:
                missingToken:
                  value:
                    timestamp: '2023-11-10T22:53:39.611+00:00'
                    status: 401
                    error: Missing token
                    path: /xc-services/api/xc/v1/clinical/documents/search
                expiredToken:
                  value:
                    timestamp: '2023-11-10T22:53:39.611+00:00'
                    status: 401
                    error: Token is expired
                    path: /xc-services/api/xc/v1/clinical/documents/search
        '403':
          description: Response when forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpClientServerError'
              example:
                timestamp: '2023-11-10T22:53:39.611+00:00'
                status: 403
                error: 'Forbidden: Missing service access'
                path: /xc-services/api/xc/v1/clinical/documents/search
        '404':
          description: Response when path is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpClientServerError'
              example:
                timestamp: '2023-11-10T22:53:39.611+00:00'
                status: 404
                error: Not found
                path: /xc-services/api/xc/v1/clinical/documents/search1
        '500':
          description: Response when an internal server error occurs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpClientServerError'
              examples:
                internalServerError:
                  value:
                    timestamp: '2023-11-10T22:53:39.611+00:00'
                    status: 500
                    error: Internal Server Error
                    path: /xc-services/api/xc/v1/clinical/documents/search
        '503':
          description: Response when service is not available.
          content:
            text/plain:
              schema:
                type: string
              example: no healthy upstream
