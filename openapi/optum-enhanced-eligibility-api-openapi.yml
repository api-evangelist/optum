              - EI
              - HPI
              - PXC
              - SY
              - TJ
            providerIdentifier:
              type: string
              minLength: 0
              maxLength: 50
              pattern: ^[A-Za-z0-9]+$
              description: 'Loop: 2100C and 2100D, Segment: PRV, Element: PRV03, Notes: Provider Identifier'
            beginningCardIssueDate:
              type: string
              description: 'Loop: 2110C and 2110D, Segment: DTP, Element: DTP03, Notes: DTP01=102, DTP02=RD8
                Retired'
            endCardIssueDate:
              type: string
              description: 'Loop: 2110C and 2110D, Segment: DTP, Element: DTP03, Notes: DTP01=102, DTP02=RD8
                Retired'
            idCardIssueDate:
              type: string
              description: 'Loop: 2110C and 2110D, Segment: DTP, Element: DTP03, Notes: DTP01=102, DTP02=D8
                Retired'
            planIssueDate:
              type: string
              description: 'Loop: 2110C and 2110D, Segment: DTP, Element: DTP03, Notes: DTP01=291, DTP02=D8
                Retired'
            beginningPlanIssueDate:
              type: string
              description: 'Loop: 2110C and 2110D, Segment: DTP, Element: DTP03, Notes: DTP01=291, DTP02=RD8
                Retired'
            endPlanIssueDate:
              type: string
              description: 'Loop: 2110C and 2110D, Segment: DTP, Element: DTP03, Notes: DTP01=291, DTP02=RD8
                Retired'
            healthCareCodeInformation:
              type: array
              minItems: 0
