                lines:
                  type: array
                  items:
                    type: string
                  example:
                  - 123 address1
                city:
                  type: string
                  example: SEATTLE
                state:
                  type: string
                  example: WA
                zip:
                  type: string
                  example: '98101'
        subscriber:
