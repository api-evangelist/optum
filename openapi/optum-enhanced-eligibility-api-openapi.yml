    CoverageDiscoveryTask:
      type: object
      description: The base object model for the `/coverage-discovery` endpoints
      properties:
        id:
          type: string
          example: 36743735-3303-4d9d-9f21-20dd5f6d7ab2
          description: The unique ID of the task
        status:
          type: string
          enum:
          - success
          - failure
          - pending
          example: success
          description: The current state of the discovery task. `pending` means at least one path has
            not completed. `success` means at least one path produced eligible coverage and no paths remain
            pending. `failure` means no path produced eligible coverage and no paths remain pending.
        tenantName:
          type: string
          example: Customer Name
        traceId:
          type: string
          example: 4c22f47b-1cca-7f48-373c-af7d887443b0,
        correlationId:
          type: string
          example: 91d76432-ac2b-4ae2-b031-f8a6615a2df4,
        name:
          type: string
          example: serial discover task
          description: Customer-configured task name assigned during enrollment to identify the overall
            discovery workflow. This root name identifies the configured task, not an individual path.
            Examples include `Medicaid + HMO` for a chained task or `Commercial + HMO + RTCOB` for a serial
            task.
        type:
          type: string
          example: serial
          enum:
          - serial
          - chained
        startDateTime:
          type: string
          format: date-time
          example: '2017-07-21T17:32:28Z'
          description: The time that the discovery task was initiated
        endDateTime:
          type: string
          format: date-time
          example: '2017-07-21T17:32:28Z'
          description: The time the discovery task finished. Omitted while the task status is `pending`.
        realTime:
          type: object
          description: The abbreviated parent Real-Time transaction response that triggered or accompanied
            the Coverage Discovery workflow. This object is populated only when a customer is enrolled
            in Integrated Coverage Discovery and selects the `Include RealTime Response` capability. Use
            this object for parent RTE context. Use `discoveryPaths.*[].transaction` for the child transactions
            produced by discovery path execution.
          properties:
            id:
              type: string
              example: ccf9a2c8-2e36-4c93-b0ec-743859e569cc
            name:
              type: string
              example: Real Time
            timestamp:
              type: string
              format: date-time
              description: The date-time the parent transaction was executed
            transaction:
              type: object
              properties:
                id:
                  type: string
                  description: The unique ID of the parent transaction response from the Real Time Flow.
                status:
                  type: string
                  enum:
                  - eligible
                  - ineligible
                  - payer_unavailable
                  - payer_not_in_system
                  - processing_error
                  - patient_unknown
                  description: The normalized outcome of the parent transaction.
                chcPayerId:
                  type: string
                  description: The CHC PayerID used in the submission of the transaction
                x12-271:
                  type: string
                  description: The raw x12-271 response from the parent Real-Time transaction.
              description: Abbreviated parent real-time transaction details.
        discoveryPaths:
          type: object
          description: A list of routes that are automatically generated based on customer configuration
            and supplied input data to attempt to find positive patient coverage.
          properties:
            successful:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: ee7612c4-d400-4b48-83e3-c05875ee8b1f
                  name:
                    type: string
                    description: The name of the discovery path that ran for this record. Typical values
                      include `Medicare`, `Commercial`, `RTCOB`, `CoverageInsight`, `Medicaid`, and `HMO`.
                  description:
                    type: string
                    description: A brief description of the path
                  timestamp:
                    type: string
                    format: date-time
                    description: The date-time the path was executed
                  transaction:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The unique ID of the transaction
                      status:
                        type: string
                        enum:
                        - eligible
                        - ineligible
                        - payer_unavailable
                        - payer_not_in_system
                        - processing_error
                        - patient_unknown
                        description: The normalized outcome of the discovery-path transaction.
                      chcPayerId:
                        type: string
                        description: The CHC PayerID used in the submission of the transaction
                      x12-271:
                        type: string
                        description: The x12-271 response from the submitted transaction
              description: 'A list of successful discovery paths. A path is deemed "successful" when the
                nested child `transaction.status` is `eligible`.

                '
            unsuccessful:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: ee7612c4-d400-4b48-83e3-c05875ee8b1f
                  name:
                    type: string
                    description: The name of the discovery path that ran for this record. Typical values
                      include `Medicare`, `Commercial`, `RTCOB`, `CoverageInsight`, `Medicaid`, and `HMO`.
                  description:
                    type: string
                    description: A brief description of the path
                  timestamp:
                    type: string
                    format: date-time
                    description: The date-time the path was executed
                  transaction:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The unique ID of the transaction
                      status:
                        type: string
                        enum:
                        - eligible
                        - ineligible
                        - payer_unavailable
                        - payer_not_in_system
                        - processing_error
                        - patient_unknown
                        description: The normalized outcome of the discovery-path transaction.
                      chcPayerId:
                        type: string
                        description: The CHC PayerID used in the submission of the transaction
                      x12-271:
                        type: string
                        description: The raw x12-271 response from the child discovery-produced transaction.
              description: 'A list of unsuccessful discovery paths. A path is deemed "unsuccessful" when
                the nested child `transaction.status` is anything other than `eligible`, including `ineligible`,
                `patient_unknown`, `payer_unavailable`, `payer_not_in_system`, and `processing_error`.
                These child transaction statuses are often the main operational signal for retry or resubmission
                decisions.

                '
            pending:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: ee7612c4-d400-4b48-83e3-c05875ee8b1f
                  name:
                    type: string
                    description: The name of the discovery path
                  description:
                    type: string
                    description: A brief description of the path
                  timestamp:
                    type: string
                    format: date-time
                    description: The date-time the path entered the pending state.
                  transaction:
                    type: object
                    example: {}
                    description: Empty while the discovery path has not executed.
              description: A list of discovery paths that have yet to be executed.
            skipped:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: ee7612c4-d400-4b48-83e3-c05875ee8b1f
                  name:
                    type: string
                    description: The name of the discovery path
                  description:
                    type: string
                    description: A brief description of the path
                  timestamp:
                    type: string
                    format: date-time
                    description: The date-time the path was evaluated and marked as skipped.
                  reason:
                    type: string
                    description: The reason why the path was skipped
              description: 'A list of skipped discovery paths. A path is considered "skipped" if there
                was an error building the path''s requests, if another path resulted in found coverage
                before the skipped path executed, or if an RTCOB or Coverage Insight request matched the
                fixed 72-hour request cache and therefore did not create a new downstream submission.
                Cached requests are represented as skipped because the downstream response is not replayed
                from that cache layer.

                '
    TransactionMedicare:
      type: object
      description: 'Medicare eligibility transaction derived from an X12 271 response (005010X279A1).
        This model represents the normalized API view of the payer response.

        '
      properties:
        id:
          type: string
          description: System-generated transaction identifier
          example: 9fb77454-8c58-4345-aa50-43f133e06d20
        correlationId:
          type: string
          description: 'Correlation identifier provided by the consumer in the request header and echoed
            back in the response. Not derived from X12.

            '
          example: corr-8b7c2f3a-1c9e-4d3b-a6f5-112233445566
        sourceType:
          type: string
          enum:
          - new
          - historical
          - duplicate
          - autosubmit
          description: How the transaction was created. `new` means the transaction was submitted through
            the Real-Time Eligibility flow. `duplicate` means customer-configured deduplication found
            a prior matching request, skipped clearinghouse submission, and returned the previous response.
            `autosubmit` means the transaction was generated by Coverage Discovery path execution. `historical`
            means the record originated from historical retrieval rather than a newly created request.
          example: new
        processedDate:
          type: string
          format: date-time
          description: Time the 271 response was processed by the system
          example: '2022-03-04T03:43:00Z'
        status:
          type: object
          description: Normalized eligibility outcome derived from the X12 271.
          properties:
            value:
              type: string
              enum:
              - eligible
              - ineligible
              - payer_unavailable
              - payer_not_in_system
              - processing_error
              - patient_unknown
              example: eligible
            description:
              type: string
        patient:
          type: object
          description: Subscriber/patient information from NM1*IL, DMG, N3, N4
