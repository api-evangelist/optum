    EligibilityRequestX12:
      type: object
      description: Real-time X12 request payload. The JSON field name is `x12`, and its value is the raw
        X12 270 request payload. The provider NPI in the X12 270 must be valid and follow standard NPI
        validation rules. The corresponding response is returned as normalized JSON, not as raw X12.
      required:
      - x12
      properties:
        x12:
          type: string
          description: Raw X12 270 eligibility inquiry payload. The provider NPI in the X12 270 must be
            valid and follow standard NPI validation rules.
          example: ISA*00*          *01*SomePwd   *ZZ*TPG00000       *ZZ*EMDEON         *220304*0343*^*00501*123456789*0*T*:~GS*HS*LLX1210001*MTEXE*20131015*2219*123456789*X*005010X279A1~ST*270*0001*005010X279A1~BHT*0022*13*1-622233a9-6fca5eb41ae6862b269452c9*20220304*0343~HL*1**20*1~NM1*PR*2*CMS*****PI*CMSMED~HL*2*1*21*1~NM1*1P*2*HAPPY
            DOCTORS GROUP PRACTICE*****XX*1234567893~HL*3*2*22*0~TRN*1*123456789*9877281234~NM1*IL*1*DOEONE*JOHNONE*M***MI*0000000000~N3*123
            address1~N4*SEATTLE*WA*981010000~DMG*D8*18800102*F~DTP*291*RD8*20210101-20211231~EQ*30~SE*20*0001~GE*1*123456789~IEA*1*123456789~
    Transaction:
      type: object
      description: The base object model for the `/transactions` endpoints and the canonical model for
        Enhanced Eligibility
      properties:
        id:
          type: string
          example: 9fb77454-8c58-4345-aa50-43f133e06d20
          description: The unique ID of the transaction
        sourceId:
          type: string
          example: 9fb77454-8c58-4345-aa50-43f133e06d20
          description: The id of the transaction that spawned this record. If empty, this transaction
            has no parent.
        sourceType:
          type: string
          enum:
          - new
          - historical
          - duplicate
          - autosubmit
          example: new
          description: How the transaction was created. `new` means the transaction was submitted through
            the Real-Time Eligibility flow. `duplicate` means customer-configured deduplication found
            a prior matching request, skipped clearinghouse submission, and returned the previous response.
            `autosubmit` means the transaction was generated by Coverage Discovery path execution. `historical`
            means the record originated from historical retrieval rather than a newly created request.
        correlationId:
          type: string
          description: An ID provided by the consumer at the time of transaction processing
        processedDate:
          type: string
          example: '2017-07-21T17:32:28Z'
          description: The time the transaction was processed by the system
        status:
          type: object
          description: The outcome of the transaction
          properties:
            value:
              type: string
              enum:
              - eligible
              - ineligible
              - payer_unavailable
              - payer_not_in_system
              - processing_error
              - patient_unknown
              example: eligible
            description:
              type: string
              example: Eligible with insurance
              description: A human readable representation of the 'value' field.
        errors:
          type: array
          items:
            type: string
          description: A list of errors that occurred during process
        benefits:
          type: array
          items:
            type: object
            example:
              service: Urgent Care
              networkClass: inNetwork
              benefitType: family
              name: copay
              type: string
              scope: common
              benefitQualifier: DY
            properties:
              service:
                type: string
                example: Urgent Care
                description: Text description of service type code
              networkClass:
                type: string
                enum:
                - inNetwork
                - outNetwork
                example: inNetwork
                description: Whether the benefit conditions apply to 'in' or 'out' of network
              benefitType:
                type: string
                enum:
                - individual
                - family
                example: individual
                description: Benefit type maps to either individual or family
              name:
                type: string
                example: copay
                description: Benefit field name
              value:
                type: string
                description: Benefit field value
              type:
                type: string
                enum:
                - string
                - date
                - number
                - percent
                - monetary
                - phone
                description: Benefit field data type
              scope:
                type: string
                enum:
                - common
                - service
                example: common
                description: Benefit field relates either to a service type or is common (not related
                  to a service type)
              insuranceType:
                type: string
                enum:
                - AllPayers
                - Medicaid
                - Medicare
                example: AllPayers
                description: 'Insurance classification: Medicare, Medicaid, or AllPayers'
              benefitQualifier:
                type: string
                example: DY (value of the benefit is in days)
                description: Benefit field code identifying type or source
          description: Detailed benefit information for each service returned by the payer
        patient:
          type: object
          properties:
            dateOfBirth:
              type: string
