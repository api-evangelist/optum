            ssn:
              type: string
              minLength: 0
              maxLength: 50
              description: 'Loop: 2100C and 2100D, Segment: REF, Element: REF02, Notes: REF01=SY Social
                Security Number'
            groupNumber:
              type: string
              minLength: 0
              maxLength: 50
              description: 'Loop: 2100C and 2100D, Segment: REF, Element: REF02, Notes: REF01=6P Group
                Number'
              example: '1111111111'
            idCard:
              type: string
              minLength: 0
              maxLength: 50
              description: 'Loop: 2100C and 2100D, Segment: REF, Element: REF02, Notes: REF01=HJ Identity
