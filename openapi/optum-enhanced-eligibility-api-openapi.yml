                    pattern: ^[A-Za-z0-9]+$
                    description: 'Loop: 2100C and 2100D, Segment: HI, Element: HI01-2, Notes: Diagnosis
                      Code'
            address:
              type: object
              properties:
                address1:
                  type: string
                  minLength: 0
                  maxLength: 55
                  description: 'Segment: N3, Element: N301, Notes: Required, Address Information'
                  example: 123 address1
                address2:
                  type: string
                  minLength: 0
                  maxLength: 55
                  description: 'Segment: N3, Element: N302, Notes: Address Information'
                city:
                  type: string
                  minLength: 0
                  maxLength: 30
                  description: 'Segment: N4, Element: N401, Notes: Required, city'
                  example: city1
                state:
                  type: string
                  minLength: 0
                  maxLength: 2
                  description: 'Segment: N4, Element: N402, Notes: state example: TN, WA'
                  example: wa
                postalCode:
                  type: string
                  minLength: 0
                  maxLength: 15
                  description: 'Segment: N4, Element: N403'
                  example: '981010000'
                countryCode:
                  type: string
                  description: 'Segment: N4, Element: N404'
                locationIdentifier:
                  type: string
                  description: 'Segment: N4, Element: N406'
                countrySubDivisionCode:
                  type: string
                  description: 'Segment: N4, Element: N407, Notes: Country SubDivision Code'
            additionalIdentification:
              type: object
              properties:
                planNumber:
                  type: string
                  minLength: 0
                  maxLength: 50
                  description: 'Loop: 2100C and 2100D, Segment: REF, Element: REF02, Notes: REF01=18 Plan
                    Number'
                policyNumber:
                  type: string
                  minLength: 0
                  maxLength: 50
                  description: 'Loop: 2100C and 2100D, Segment: REF, Element: REF02, Notes: REF01=1L Group
                    or Policy Number'
                memberIdentificationNumber:
                  type: string
