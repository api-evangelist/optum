              example: F
            dateOfBirth:
              type: string
              format: date
              example: '1880-01-02'
        payer:
          type: object
          description: Primary and additional payer information from the 271
          properties:
            chcId:
              type: string
              description: Normalized CHC payer identifier returned on the real-time transaction response.
              example: '60054'
            name:
              type: string
              example: CMSMED
            phone:
              type: string
              example: '0000000000'
            url:
              type: string
              example: www.testwebsite.com
            otherPayer:
              type: object
              description: Additional payer from LS/2120 loop
              properties:
                name:
                  type: string
                  example: extra healthy insurance
                address:
                  type: object
                  properties:
                    lines:
                      type: array
                      items:
                        type: string
                      example:
                      - 123 address1
                    city:
                      type: string
                      example: Nashville
                    state:
                      type: string
                      example: TN
                    zip:
                      type: string
                      example: '37203'
        plan:
          type: object
          description: Medicare plan and pharmacy information
          properties:
            insuranceType:
              type: string
              enum:
              - Medicare
              example: Medicare
            beginDate:
              type: string
              format: date
              description: Coverage start date (DTP*291)
              example: '2004-11-01'
            endDate:
              type: string
              format: date
              description: Coverage end date (DTP*291 RD8)
              example: '2021-12-31'
            number:
              type: string
              description: Plan identifier from REF*18
              example: S5601
            description:
              type: string
              description: Plan description from REF*N6
              example: SilverScript SmartRx
        benefits:
          type: array
          description: Benefits derived from EB, DTP, and MSG segments
          items:
            type: object
            properties:
              service:
                type: string
                description: Service type derived from EB03
                example: Health Coverage
              name:
                type: string
                description: Benefit name derived from EB01
                example: copay
              value:
                type: string
                example: '1484'
              type:
                type: string
                enum:
                - string
                - date
                - number
                - percent
                - monetary
                example: monetary
              insuranceType:
                type: string
                enum:
                - Medicare
                example: Medicare
              benefitQualifier:
                type: string
                description: EB segment qualifiers (EB01 / EB06 / EB09)
                example: EB01=C
        x12-271:
          type: string
