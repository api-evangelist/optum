        required: true
        schema:
          type: string
        example: 99213,99214
      - name: viewType
        in: query
        description: Any of these view types (Conflict or Code) are allowed Types, default is Conflict Type
        required: false
        schema:
          type: string
          enum:
          - Conflict
          - Code
        example: Conflict
      - name: isMpfs
        in: query
        required: false
        schema:
          type: boolean
          default: true
        example: true
      - name: yyyy-MM-dd
        in: header
