  /api/cms/facility/cci/cci-edits-list/{list-type}:
    get:
      tags:
      - CCI Edits APIs
      summary: Facility - fetch CCI edits list for all, addition and deleted codes
      operationId: getCCIEditsList
      parameters:
      - name: list-type
        in: path
        required: true
        schema:
          type: string
          enum:
          - all
          - addition
          - deletion
      - name: sort
        in: query
        description: Any of these (code1,-code1,code2,-code2,modifier,-modifier) are allowed values, default is -code1
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - code1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Facility - Fetch CCI Edits List for all, addition and deleted codes
          content:
            application/json:
              example:
              - - code1: 0001U
                  code2: 0029U
                  modifier: 1
                  versionDesc: 94
                  effDate: '2024-01-01 00:00:00'
                - code1: 0001U
                  code2: 0030U
                  modifier: 1
                  versionDesc: 94
                  effDate: '2024-01-01 00:00:00'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                timestamp: '2023-07-14T06:37:03.741+00:00'
                status: 404
                error: Not Found
                message: Not Found
                path: /cmscommonms/api/cms/facility/cci/invalid
        '500':
