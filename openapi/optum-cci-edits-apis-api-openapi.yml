openapi: 3.2.0
info:
  title: Optum CCI Edits APIs API
  version: v1.0
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  description: 'Operations tagged CCI Edits APIs across 2 of this provider''s published API definitions: optum-cms-common-facility-openapi.yml, optum-cms-common-physician-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1/cmscommonms
tags:
- name: CCI Edits APIs
paths:
  /app/cms/common/cci/modifiers/{code}:
    get:
      tags:
      - CCI Edits APIs
      summary: Fetches modifiers based on given code
      operationId: fetchRelatedLCDPolicyByPolicyById_1
      parameters:
      - name: code
        in: path
        description: Code
        required: true
        schema:
          type: string
        example: 99213
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OptumPageImplModifiersPopUpValue'
      security:
      - bearerAuth: []
    servers:
    - url: /v1/cmscommonms
  /api/cms/facility/cci/{code}/{column-type}:
    get:
      tags:
      - CCI Edits APIs
      summary: Facility - Fetch CCI Edits for single code
      operationId: getSingleCodeView_1
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        example: 99213
      - name: column-type
        in: path
        required: true
        schema:
          type: string
          enum:
          - primary
          - secondary
      - name: sort
        in: query
        description: Any of these (code,-code) are allowed values, default is -code
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - code
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Facility - Fetch CCI Edits for single code
          content:
            application/json:
              example:
                content:
                - code: 0362T
                  description: Behavior identification supporting assessment, each 15 minutes of technicians' time face-to-face with a patient
                  modifier: modifier allowed, codes may be used together if documentation supports their use
                - code: 0373T
                  description: Adaptive behavior treatment with protocol modification, each 15 minutes of technicians' time face-to-face with a patient
                  modifier: modifier allowed, codes may be used together if documentation supports their use
                totalCount: 2
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                timestamp: '2023-07-14T06:37:03.741+00:00'
                status: 404
                error: Not Found
                message: Not Found
                path: /cmscommonms/api/cms/facility/cci/invalid
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2023-07-28T06:36:22.518+00:00'
                path: /cmscommonms/api/cms/facility/cci
                status: 500
                error: Internal Server Error
                requestId: e36d239e-324
      security:
      - bearerAuth: []
    servers:
    - url: /v1/cmscommonms
  /api/cms/facility/cci/print:
    get:
      tags:
      - CCI Edits APIs
      summary: Facility - Prints CCI Edits for multi code
      operationId: printCCIResults_1
      parameters:
      - name: codes
        in: query
        description: Takes comma separated codes with minimum of 2 codes and maximum of 36 codes
        required: true
        schema:
          type: string
        example: 99213,99214
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
      security:
      - bearerAuth: []
    servers:
    - url: /v1/cmscommonms
  /api/cms/facility/cci/effective-date-version:
    get:
      tags:
      - CCI Edits APIs
      summary: Facility - Fetch CCI Edits Effective Date and Version Description
      operationId: getCCIEffectiveDateAndVersionDesc
      parameters:
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Facility - Fetch CCI Edits Effective Date and Version Description
          content:
            application/json:
              example:
                versionDesc: 94
                effDate: '2024-01-01 00:00:00'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                timestamp: '2024-03-06T06:37:03.741+00:00'
                status: 404
                error: Not Found
                message: Not Found
                path: /cmscommonms/api/cms/facility/cci/invalid
      security:
      - bearerAuth: []
    servers:
    - url: /v1/cmscommonms
