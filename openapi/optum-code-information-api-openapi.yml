  /codetype/{codetype}/{code}/physician-docs:
    get:
      tags:
      - Code Information
      summary: Return physician document for the given icd10cm {code}
      operationId: getPhysicianDocs
      parameters:
      - name: codetype
        in: path
        description: The codetype needed to identify the type of code
        required: true
        schema:
          type: string
          enum:
          - icd10cm
      - name: code
        in: path
        description: The code value for the respective codetype
        required: true
        schema:
          type: string
        example: S52
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicianDocs'
              example:
                physicianDoc:
                - title: Fracture 7th characters
                  text: '<P>The 7th character in fractures is based on the Gustillo classification.&nbsp;&nbsp;&nbsp; The following information is important to assign the appropriate 7th character:</P>

                    <OL>

                    <LI>Episode of care - Initial, subsequent, sequela</LI>

                    <UL>

                    <LI>Initial encounter - patient is receiving active treatment for the fracture</LI>

                    <UL>

                    <LI>Examples - surgical treatment, emergency department encounter, evaluation by new physician</LI></UL>

                    <LI>Subsequent encounter - patient has completed active treatment for the condition</LI>

                    <UL>

                    <LI>Examples - cast change/removal, medication adjustment, followup visits</LI></UL>

                    <LI>Sequela - complications or conditions that arise as a direct result&nbsp;of a condition</LI>

                    <UL>

                    <LI>Example - scar from a burn.&nbsp;&nbsp; The scar would be coded separately, but the burn would be assigned the "S" seventh character as the injury responsible for the scar.&nbsp;</LI></UL></UL>

                    <LI>Open or closed fracture</LI>

                    <UL>

                    <LI>If open, Type I or Type II (Gustillo classification)</LI>

                    <LI>If open, Type IIIA, IIIB, or IIIC</LI></UL>

                    <LI>Healing </LI>

                    <UL>

                    <LI>Routine healing</LI>

                    <LI>Delayed healing</LI>

                    <LI>Malunion</LI>

                    <LI>Nonunion</LI></UL></OL>

                    <P>&nbsp;</P>'
        '400':
          description: Wrong codetype
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicianDocs'
              example:
                error:
                - The code provided ('33213') in this web service request is not a valid 'icd10cm' code.
                warning: []
                info: []
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
