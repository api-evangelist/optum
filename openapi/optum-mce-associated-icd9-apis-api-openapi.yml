openapi: 3.2.0
info:
  title: CMS Common Facility MCE Associated ICD9 APIs API
  description: MicroService that contains CMS related information
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  version: v1.0
servers:
- url: /v1/cmscommonms
tags:
- name: MCE Associated ICD9 APIs
paths:
  /api/cms/facility/mce/associated-icd9/{id}:
    get:
      tags:
      - MCE Associated ICD9 APIs
      summary: Fetches MCE Associated ICD9 Codes
      operationId: getMCEAssociatedICD9Codes
      parameters:
      - name: sort
        in: query
        description: Any of these (code,-code) are allowed values, default is +code
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - code
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Fetch MCE associated ICD9 codes
          content:
            application/json:
              example:
                content:
                - code: '040.41'
                  codeDescription: Infant botulism
                  details: 'Pediatric Age:  0-17  These diagnosis are intended for children and the patient''s age must be between 0 and 17 years.'
                - code: '058.10'
                  codeDescription: Roseola infantum, unspecified
                  details: 'Pediatric Age:  0-17  These diagnosis are intended for children and the patient''s age must be between 0 and 17 years.'
                totalCount: 3
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                timestamp: '2023-07-14T06:37:03.741+00:00'
                status: 404
                error: Not Found
                message: Not Found
                path: /cmscommonms/api/cms/facility/mce/associated-icd91/4
        '500':
          description: Interal server error
          content:
            application/json:
              example:
                timestamp: '2023-07-13T06:36:22.518+00:00'
                path: /cmscommonms/api/cms/facility/mce/associated-icd9/4
                status: 500
                error: Internal Server Error
                requestId: e36d239e-324
      security:
      - bearerAuth: []
components:
  schemas:
    Notification:
      type: object
      properties:
        error:
          type: array
          items:
            type: string
        warning:
          type: array
          items:
            type: string
        info:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-readme:
  explorer-enabled: true
  proxy-enabled: true
