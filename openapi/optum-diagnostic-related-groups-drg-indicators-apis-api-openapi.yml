openapi: 3.2.0
info:
  title: Optum Common Facility Diagnostic Related Groups (DRG) Indicators APIs API
  description: MicroService that contains Optum module-related information
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  version: v1.0
servers:
- url: /v1/optumcommonms
tags:
- name: Diagnostic Related Groups (DRG) Indicators APIs
paths:
  /api/optum/facility/drg-indicators:
    get:
      tags:
      - Diagnostic Related Groups (DRG) Indicators APIs
      operationId: getDRGIndicatorList
      parameters:
      - name: sort
        in: query
        description: Any of these values (drgCode,-drgCode,mdcCode,-mdcCode) are allowed.The default is drgCode
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - drgCode
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Fetch DRG indicator list
          content:
            application/json:
              example:
                content:
                - drgId: '39806'
                  drgCode: '014'
                  drgDescription: Allogeneic Bone Marrow Transplant
                  mdcCode: PRE
                  mdcDescription: Pre MDC
                  medSurg: M
                  gmLos: '25.6'
                  amLos: '28.7'
                  relativeWeight: '11.4609'
                - drgId: '39757'
                  drgCode: '987'
                  drgDescription: Nonextensive O.R. Procedures Unrelated to Principal Diagnosis with MCC
                  mdcCode: ALL
                  mdcDescription: All MDC
                  medSurg: S
                  gmLos: '8.2'
                  amLos: '11.4'
                  relativeWeight: '3.3767'
                  iconIds: DRG MCC,Special Payment
                totalCount: 2
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2024-08-22T07:29:21.890+00:00'
                status: 500
                error: Internal Server Error
                message: 'Request processing failed: java.lang.IllegalArgumentException: Page index must not be less than zero'
                path: /optumcommonms/api/optum/facility/drg-indicators
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-readme:
  explorer-enabled: true
  proxy-enabled: true
