openapi: 3.0.3
info:
  title: Dental Attachment API
  description: The Dental Attachment API offers functionality related toDental Attachment.
  version: 2.2.0
security:
- Bearer: []
servers:
- url: https://sandbox-apigw.optum.com
paths:
  /dentalnetwork/attachments/v1/CreateAttachment:
    post:
      summary: Create attachment container
      tags:
      - Attachment
      requestBody:
        description: Creates an attachment container that can contain a claim with its attachments. Whenever
          a claim is submitted with attachment(s), the container creates an Optum Attachment ID.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attachment'
      responses:
        '201':
          description: 201 Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
