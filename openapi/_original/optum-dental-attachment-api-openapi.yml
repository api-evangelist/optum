      type: object
      properties:
        vendorId:
          type: integer
          format: int32
        vendorTransactionId:
          type: integer
          format: int32
        vendorClaimId:
          type: string
          nullable: true
        attachmentId:
          type: integer
          format: int32
        clearinghouseTraceNumber:
          type: string
          nullable: true
        payerId:
          type: string
          nullable: true
        payerName:
          type: string
          nullable: true
        payerReferenceNumber:
          type: string
          nullable: true
        payerContactName:
          type: string
          nullable: true
        payerCommNumberQualifier1:
          type: string
          nullable: true
        payerCommNumber1:
          type: string
          nullable: true
        payerCommNumberQualifier2:
          type: string
          nullable: true
        payerCommNumber2:
          type: string
          nullable: true
        payerCommNumberQualifier3:
          type: string
          nullable: true
        payerCommNumber3:
          type: string
          nullable: true
