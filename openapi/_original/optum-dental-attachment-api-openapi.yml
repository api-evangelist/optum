      - name: attachmentId
        in: path
        schema:
          type: integer
        required: true
        description: The id of the attachment record
        example: 12345433
      - name: attachmentFileId
        in: path
        schema:
          type: integer
        required: true
        description: 'The id of the attachment file '
        example: 1233456        -
