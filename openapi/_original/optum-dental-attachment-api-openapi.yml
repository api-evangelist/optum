          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: An unexpected error occurred within a gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The endpoint is not available, or an unknown endpoint has been requested.
          content:
            application/json:
