  /dentalnetwork/attachments/v1/CommitAttachment/{attachmentId}:
    patch:
      summary: Commits the attachment container and files
      description: Commits the attachment container and files. Once the attachment is committed, you can
        add files but cannot update/modify the attachment container and files.
      tags:
      - Attachment
      parameters:
      - name: attachmentId
        in: path
        schema:
          type: integer
        required: true
        description: The id of the unsubmitted claim to submit
        example: 12345
      responses:
        '200':
          description: Ok
        '400':
          description: The request has missing, invalid, or malformed data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The given unsubmitted claim does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The given claim has already been submitted.
          content:
            application/json:
              schema:
