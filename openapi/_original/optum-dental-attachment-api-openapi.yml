          type: boolean
        serviceLineReferenceNumber:
          type: string
          nullable: true
        serviceLineChargeAmt:
          type: number
          format: double
        procedureCode:
          type: string
          nullable: true
        loincCode:
          type: string
          nullable: true
        requestDate:
          type: string
          format: date-time
        isCommitted:
          type: boolean
        isSolicited:
          type: boolean
        attachmentFile:
