          type: string
          nullable: true
        renderingProviderFirstName:
          type: string
          nullable: true
        patientControlNumber:
          type: string
          nullable: true
        patientLastName:
          type: string
          nullable: true
        patientFirstName:
          type: string
          nullable: true
        patientDob:
          type: string
          format: date-time
        insuredId:
          type: string
          nullable: true
        insuredLastName:
          type: string
          nullable: true
        insuredFirstName:
          type: string
          nullable: true
        insuredDob:
          type: string
          format: date-time
        serviceDateLow:
          type: string
          format: date-time
        serviceDateHigh:
          type: string
          format: date-time
        totalChargeAmt:
          type: number
          format: double
        statusCode:
          type: integer
          format: int32
        statusDate:
          type: string
          format: date-time
