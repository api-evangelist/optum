  /dentalnetwork/attachments/v1/GetPayerBusinessRules/me:
    get:
      summary: Get payer business rule
      description: Optum stores each payer’s rules for the procedure codes that require an attachment.
        If an attachment rule exists, it will be returned along with any details related to the attachment
        requirement.
      tags:
      - Attachment
      parameters:
      - name: payerid
        in: query
        schema:
          type: string
        description: Identifies the payer to Optum.
        required: true
      - name: procedurecodes
        in: query
        schema:
