components:
  schemas:
    AssociationStatus:
      properties:
        payerId:
          type: string
        providerId:
          type: string
        providerIdType:
          type: string
        rejectionReason:
          type: string
        status:
          type: string
        statusDate:
          type: string
      type: object
    EnrollmentRoot:
      properties:
        attachment1:
          description: Base64 encoded string
          type: string
        attachment2:
          description: Base64 encoded string
          type: string
        attachment3:
          description: Base64 encoded string
          type: string
        authorizedSignature:
          type: string
        clearinghouseContactName:
          type: string
        clearinghouseName:
          type: string
        emailAddress:
          type: string
        epId:
          format: int64
          type: integer
        errorMessages:
          type: string
        otherId:
          type: string
        otherIdentifiers:
          $ref: '#/components/schemas/OtherIdentifiers'
        payerId:
          type: string
        preferenceForAggregation:
          $ref: '#/components/schemas/PreferenceForAggregation'
        providerAddress:
          $ref: '#/components/schemas/ProviderAddress'
        providerContact:
          $ref: '#/components/schemas/ProviderContact'
        providerIdentifiers:
          $ref: '#/components/schemas/ProviderIdentifiers'
        providerName:
          type: string
        reasonForSubmission:
          enum:
          - NEW_ENROLLMENT
          - CHANGE_ENROLLMENT
          - CANCEL_ENROLLMENT
          type: string
        statuses:
          $ref: '#/components/schemas/ProviderEnrollmentStatus'
        version:
          format: int32
          type: integer
      type: object
    OtherIdentifiers:
      properties:
        assigningAuthority:
          type: string
        tradingPartnerId:
          type: string
      type: object
    PreferenceForAggregation:
      properties:
        npi:
          format: int64
          type: integer
        tin:
          format: int64
          type: integer
      type: object
    ProviderAddress:
      properties:
        city:
          type: string
        stateProvince:
          type: string
        street:
          type: string
        zipCode:
          type: string
      type: object
    ProviderContact:
      properties:
        contactName:
          type: string
        emailAddress:
          type: string
        faxNumber:
          type: string
        telephoneNumber:
          type: string
        telephoneNumberExtension:
          type: string
      type: object
    ProviderEnrollmentStatus:
      properties:
        associationStatuses:
          items:
            $ref: '#/components/schemas/AssociationStatus'
          type: array
        enrollmentStatus:
          type: string
      type: object
    ProviderIdentifiers:
      properties:
        npi:
          format: int64
          type: integer
        tinOrEin:
          format: int64
          type: integer
      type: object
    ResultSummary:
      properties:
        acceptedRecords:
          items:
            $ref: '#/components/schemas/EnrollmentRoot'
          type: array
        numberOfRecordsAccepted:
          format: int64
          type: integer
        numberOfRecordsRecieved:
          format: int64
          type: integer
        numberOfRecordsRejected:
          format: int64
          type: integer
        rejectedRecords:
          items:
            $ref: '#/components/schemas/EnrollmentRoot'
          type: array
        status:
          type: string
      type: object
    SubmissionResponse:
      properties:
        payloadId:
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    oauth2:
      flows:
        clientCredentials:
          scopes:
            profile: ''
          tokenUrl: https://sandbox-apigw.optum.com/apip/auth/sntl/v1/token
      type: oauth2
info:
  title: edi-enrollment-v1
  version: 1.0.0
openapi: 3.0.1
paths:
  /era/enrollment-submission:
    post:
      description: Takes a JSON body and will return a Payload ID that can be used later to retrieve the
        results.
      operationId: submitEraEnrollment
      parameters:
      - description: Tenant ID of the Organization.
        in: header
        name: tenant-id
        required: true
        schema:
          example: TESTWINH
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Example:
                description: Example
                value:
                - attachment1: 
                  authorizedSignature: Tim
                  clearinghouseContactName: Jim
                  clearinghouseName: Availity
                  emailAddress: asdf@optum.com
                  otherId: AvailityId
                  otherIdentifiers:
                    assigningAuthority: OPTUM
                    tradingPartnerId: TESTWINH
                  payerId: '60054'
                  preferenceForAggregation:
                    npi: 1234567893
                    tin: 123456789
                  providerAddress:
                    city: Nashville
                    stateProvince: TN
                    street: 123 Street
                    zipCode: '23456'
                  providerContact:
                    contactName: Jack
                    emailAddress: test@optum.com
                    faxNumber: '4445556666'
                    telephoneNumber: '1112223333'
                    telephoneNumberExtension: '11'
                  providerIdentifiers:
                    npi: 1234567893
                    tinOrEin: 123456789
                  providerName: Atena
                  reasonForSubmission: NEW_ENROLLMENT
                  version: 5010
            schema:
              items:
                $ref: '#/components/schemas/EnrollmentRoot'
              type: array
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
                payloadId:
                  description: Payload ID used to retrieve the results of processing later.
                  summary: Record accepted for processing.
                  value:
                    payloadId: e2ea9f8f-2460-4330-8c78-6ad7624fda855
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
          description: Records accepted for processing.
        '400':
          content:
            application/json:
              examples:
                Request payload could not be parsed.:
                  description: The request could not be parsed. No record was created.
                  summary: Request payload could not be parsed.
                  value:
                    error: Request payload could not be parsed.
                    path: /edi/enrollment/era/enorllment-submission
                    status: 400
                    timestamp: '2023-04-25T17:18:44.183148600Z'
                    traceId: feb61a5d-656f-4690-9af1-4cfa4c9b8502
          description: Bad Request
        '500':
          content:
            application/json:
              examples:
                Internal Server Error.:
                  description: It's not you, it's us, probably.  Something unexpected happened while processing
                    your request.  Please include the 'traceId' when contacting support.
                  summary: Internal Server Error.
                  value:
                    error: Internal Server Error
                    path: /edi/enrollment/era/enorllment-submission
                    status: 500
                    timestamp: '2023-04-25T18:16:37.990376100Z'
                    traceId: 133cab33-6839-423e-b554-eeec78c9b3e9
          description: Server Error
      summary: Submit ERA Enrollment records for processing.
      tags:
      - ERA Enrollment API
  /era/results/{payloadId}:
    get:
      operationId: getResults
      parameters:
      - description: Tenant ID of the Organization.
        in: header
        name: tenant-id
        required: true
        schema:
          example: TESTWINH
          type: string
      - description: The Payload ID returned when the records were submitted.
        example: e2ea9f8f-2460-4330-8c78-6ad7624fda855
        in: path
        name: payloadId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                Errored.:
                  description: An error occurred processing the record.  Contact support.
                  summary: Errored
                  value:
                    status: Errored
                Processing Complete:
                  description: Uploaded request has finished processing.  The response contains the results.
                  summary: Processing Complete
                  value:
                    acceptedRecords:
                    - authorizedSignature: Tim
                      clearinghouseContactName: Jim
                      clearinghouseName: Availity
                      emailAddress: asdf@optum.com
                      otherId: AvailityId
                      otherIdentifiers:
                        assigningAuthority: OPTUM
                        tradingPartnerId: TESTWINH
                      payerId: '60054'
                      preferenceForAggregation:
                        npi: 1234567893
                        tin: 123456789
                      providerAddress:
                        city: Nashville
                        stateProvince: TN
                        street: 123 Street
                        zipCode: '23456'
                      providerContact:
                        contactName: Jack
                        emailAddress: test@optum.com
                        faxNumber: '4445556666'
                        telephoneNumber: '1112223333'
                        telephoneNumberExtension: '11'
                      providerIdentifiers:
                        npi: 1234567893
                        tinOrEin: 123456789
                      providerName: Atena
                      reasonForSubmission: NEW_ENROLLMENT
                      statuses:
                        associationStatuses:
                        - payerId: '60054'
                          providerId: '1234567893'
                          providerIdType: NPI
                          status: Associated
                          statusDate: '2024-03-28T17:14:26.140149'
                        - payerId: '60054'
                          providerId: '123456789'
                          providerIdType: TIN
                          status: Associated
                          statusDate: '2024-03-28T17:14:26.140149'
                      version: 5010
                    numberOfRecordsAccepted: 1
                    numberOfRecordsRecieved: 2
                    numberOfRecordsRejected: 1
                    rejectedRecords:
                    - authorizedSignature: Tim
                      clearinghouseContactName: Jim
                      clearinghouseName: Availity
                      emailAddress: asdf@optum.com
                      errorMessages: 'Provider NPI is invalid.

                        Preference for Aggregation NPI is invalid.

                        Preference for Aggregation NPI must match Provider NPI.'
                      otherId: AvailityId
                      otherIdentifiers:
                        assigningAuthority: OPTUM
                        tradingPartnerId: TESTWINH
                      payerId: '60054'
                      preferenceForAggregation:
                        npi: 1111111111
                        tin: 123456789
                      providerAddress:
                        city: Nashville
                        stateProvince: TN
                        street: 123 Street
                        zipCode: '23456'
                      providerContact:
                        contactName: Jack
                        emailAddress: test@optum.com
                        faxNumber: '4445556666'
                        telephoneNumber: '1112223333'
                        telephoneNumberExtension: '11'
                      providerIdentifiers:
                        npi: 22222222
                        tinOrEin: 123456789
                      providerName: Atena
                      reasonForSubmission: NEW_ENROLLMENT
                      version: 5010
                    status: Complete
                Still Processing.:
                  description: The record is still being processed.  No results are available right now.
                    Check back later.
                  summary: Still Processing
                  value:
                    status: Processing
              schema:
                $ref: '#/components/schemas/ResultSummary'
          description: Processing results found.
        '404':
          content:
            application/json:
              examples:
                Record Not Found:
                  description: The requested record could not be found.
                  summary: Record Not Found
                  value:
                    error: Not Found.
                    path: /edi/enrollment/era/results/237565d4-20b3-4170-882c-ce28811f9d362
                    status: 404
                    timestamp: '2023-04-26T17:40:55.449055300Z'
                    traceId: 645a5e81-cdde-40ea-a651-e7cfe02277f8
          description: Not Found
        '500':
          content:
            application/json:
              examples:
                Internal Server Error.:
                  description: It's most definitely us.  Something unexpected happened while processing
                    your request.  Please include the 'traceId' when contacting support.
                  summary: Internal Server Error.
                  value:
                    error: Internal Server Error
                    path: /edi/enrollment/era/results/237565d4-20b3-4170-882c-ce28811f9d362
                    status: 500
                    timestamp: '2023-04-25T18:16:37.990376100Z'
                    traceId: 133cab33-6839-423e-b554-eeec78c9b3e9
          description: Server Error
      summary: Retrieve results of ERA Enrollment record processing.
      tags:
      - ERA Enrollment API
