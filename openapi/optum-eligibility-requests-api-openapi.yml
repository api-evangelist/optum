  headers:
    correlationid:
      schema:
        type: string
        example: 9fb77454-8c58-4345-aa50-43f133e06d20
      description: A unique identifier value that is attached to the response that allow reference to the original request. Differs from `x-optum-trace-id` as the correlation-id is stored within the datastore for future queryability.
    rte-link:
      schema:
        type: string
        example: </coverage-discovery/0716e3e8-87ee-11ee-b9d1-0242ac120002>; title="coverage discovery - Default Discovery Task"; rel="related", </coverage-discovery/0e565a58-87ee-11ee-b9d1-0242ac120002>; title="coverage discovery - Chained Discovery Task"; rel="related"
      description: (Optional) RFC 8288-style related-resource link header returned by real-time eligibility POST responses when Coverage Discovery task(s) are spawned. The header may include one or more related task paths. Each related path can be used with `GET /coverage-discovery/{id}` to retrieve task status. If you are enrolled in Coverage Discovery and this header is absent, no Coverage Discovery task was initiated for that transaction.
    traceid:
      schema:
        type: string
        example: 9fb77454-8c58-4345-aa50-43f133e06d20
      description: A unique identifier value that is attached to the response that allow reference to the original request.
    tenantid:
      schema:
        type: string
        example: 9fb77454-8c58-4345-aa50-43f133e06d20
      description: The unique ID of the tenant that invoking user belongs to. Used to enforce data tenancy.
    subtenantid:
      schema:
        type: string
        example: 5e2f9f4f-6f1d-4b37-92b5-6c5a9d1f8a21
      description: (Optional) Identifies an Optum-assigned sub-tenant configuration for your organization. Include this header only when Optum has provided a value for a specific enabled customer configuration. Clients must not generate or infer this value.
  examples:
    EligibilityRequestMinimal:
      value:
        tradingPartnerServiceId: CIGNA
        provider:
          organizationName: Example Medical Center
          npi: '1234567893'
        subscriber:
          memberId: '12313423'
