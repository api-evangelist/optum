    TransactionMedicare:
      type: object
      description: 'Medicare eligibility transaction derived from an X12 271 response (005010X279A1). This model represents the normalized API view of the payer response.

        '
      properties:
        id:
          type: string
          description: System-generated transaction identifier
          example: 9fb77454-8c58-4345-aa50-43f133e06d20
        correlationId:
          type: string
          description: 'Correlation identifier provided by the consumer in the request header and echoed back in the response. Not derived from X12.

            '
          example: corr-8b7c2f3a-1c9e-4d3b-a6f5-112233445566
        sourceType:
          type: string
          enum:
          - new
          - historical
          - duplicate
          - autosubmit
          description: How the transaction was created. `new` means the transaction was submitted through the Real-Time Eligibility flow. `duplicate` means customer-configured deduplication found a prior matching request, skipped clearinghouse submission, and returned the previous response. `autosubmit` means the transaction was generated by Coverage Discovery path execution. `historical` means the record originated from historical retrieval rather than a newly created request.
          example: new
        processedDate:
          type: string
          format: date-time
          description: Time the 271 response was processed by the system
          example: '2022-03-04T03:43:00Z'
        status:
          type: object
          description: Normalized eligibility outcome derived from the X12 271.
          properties:
            value:
              type: string
              enum:
              - eligible
              - ineligible
              - payer_unavailable
              - payer_not_in_system
              - processing_error
              - patient_unknown
              example: eligible
            description:
              type: string
        patient:
          type: object
          description: Subscriber/patient information from NM1*IL, DMG, N3, N4
          properties:
            firstName:
              type: string
              example: JOHNONE
            lastName:
              type: string
              example: DOEONE
            middleName:
              type: string
              example: M
            memberId:
              type: string
              description: Medicare beneficiary identifier
              example: '0000000000'
            gender:
              type: string
              example: F
            dateOfBirth:
              type: string
              format: date
              example: '1880-01-02'
            relationship:
              type: string
              description: Normalized patient relationship when present on the transaction response.
              example: CHILD
            address:
              type: object
              properties:
                lines:
                  type: array
                  items:
                    type: string
                  example:
                  - 123 address1
                city:
                  type: string
                  example: SEATTLE
                state:
                  type: string
                  example: WA
                zip:
                  type: string
                  example: '98101'
        subscriber:
          type: object
          description: 'Subscriber details. For Medicare responses, the subscriber is the patient, so this object mirrors `patient` when both are present.

            '
          properties:
            firstName:
              type: string
              example: JOHNONE
            lastName:
              type: string
              example: DOEONE
            memberId:
              type: string
              example: '0000000000'
            gender:
              type: string
              example: F
            dateOfBirth:
              type: string
              format: date
              example: '1880-01-02'
        payer:
          type: object
          description: Primary and additional payer information from the 271
          properties:
            chcId:
              type: string
              description: Normalized CHC payer identifier returned on the real-time transaction response.
              example: '60054'
            name:
              type: string
              example: CMSMED
            phone:
              type: string
              example: '0000000000'
            url:
              type: string
              example: www.testwebsite.com
            otherPayer:
              type: object
              description: Additional payer from LS/2120 loop
              properties:
                name:
                  type: string
                  example: extra healthy insurance
                address:
                  type: object
                  properties:
                    lines:
                      type: array
                      items:
                        type: string
                      example:
                      - 123 address1
                    city:
                      type: string
                      example: Nashville
                    state:
                      type: string
                      example: TN
                    zip:
                      type: string
                      example: '37203'
        plan:
          type: object
          description: Medicare plan and pharmacy information
          properties:
            insuranceType:
              type: string
              enum:
              - Medicare
              example: Medicare
            beginDate:
              type: string
              format: date
              description: Coverage start date (DTP*291)
              example: '2004-11-01'
            endDate:
              type: string
              format: date
              description: Coverage end date (DTP*291 RD8)
              example: '2021-12-31'
            number:
              type: string
              description: Plan identifier from REF*18
              example: S5601
            description:
              type: string
              description: Plan description from REF*N6
              example: SilverScript SmartRx
        benefits:
          type: array
          description: Benefits derived from EB, DTP, and MSG segments
          items:
