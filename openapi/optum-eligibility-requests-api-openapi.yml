  responses:
    ForbiddenError:
      description: Forbidden.
      headers:
        x-optum-tenant-id:
          $ref: '#/components/headers/tenantid'
        x-optum-subtenant-id:
          $ref: '#/components/headers/subtenantid'
        x-optum-correlation-id:
          $ref: '#/components/headers/correlationid'
        x-optum-trace-id:
          $ref: '#/components/headers/traceid'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
          - invalid tenant id
    UnexpectedError:
      description: Unexpected error.
      headers:
        x-optum-tenant-id:
          $ref: '#/components/headers/tenantid'
        x-optum-subtenant-id:
          $ref: '#/components/headers/subtenantid'
        x-optum-correlation-id:
          $ref: '#/components/headers/correlationid'
        x-optum-trace-id:
          $ref: '#/components/headers/traceid'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EligibilityResponse:
      description: OK. Returns the normalized real-time eligibility response. If Coverage Discovery was automatically started, the response `link` header contains related discovery task resource path(s).
      headers:
        x-optum-tenant-id:
          $ref: '#/components/headers/tenantid'
        x-optum-subtenant-id:
          $ref: '#/components/headers/subtenantid'
        x-optum-correlation-id:
          $ref: '#/components/headers/correlationid'
        x-optum-trace-id:
          $ref: '#/components/headers/traceid'
        link:
          $ref: '#/components/headers/rte-link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Transaction'
          examples:
            RTE Response Patient Unknown:
              $ref: '#/components/examples/RTEEligibilityResponsePatientUnknown'
            RTE Response Ineligible:
              $ref: '#/components/examples/RTEEligibilityResponseIneligible'
            RTE Response HMO:
              $ref: '#/components/examples/RTEEligibilityResponseHMO'
    BadRequestError:
      description: Bad request.
      headers:
        x-optum-tenant-id:
          $ref: '#/components/headers/tenantid'
        x-optum-subtenant-id:
          $ref: '#/components/headers/subtenantid'
        x-optum-correlation-id:
          $ref: '#/components/headers/correlationid'
        x-optum-trace-id:
          $ref: '#/components/headers/traceid'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
          - Failed Precondition - Field 'example' is required
    PermissionDeniedError:
      description: Unauthorized.
      headers:
        x-optum-subtenant-id:
          $ref: '#/components/headers/subtenantid'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: invalid_product
              error_description:
                type: string
                example: Permission Denied.
              traceId:
                type: string
                example: 942537e6-d544-ed7c-469b-a27efc4a6cff
    EligibilityResponseX12:
      description: OK. Returns a normalized JSON representation of the X12 271 response, not a raw X12 payload.
      headers:
        x-optum-tenant-id:
          $ref: '#/components/headers/tenantid'
        x-optum-subtenant-id:
          $ref: '#/components/headers/subtenantid'
        x-optum-correlation-id:
          $ref: '#/components/headers/correlationid'
        x-optum-trace-id:
          $ref: '#/components/headers/traceid'
        link:
          $ref: '#/components/headers/rte-link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionMedicare'
          examples:
            RTE Response Patient Unknown:
              $ref: '#/components/examples/RTEEligibilityResponsePatientUnknown'
            RTE Response Ineligible:
              $ref: '#/components/examples/RTEEligibilityResponseIneligible'
            RTE Response HMO:
              $ref: '#/components/examples/RTEEligibilityResponseHMO'
  parameters:
    header-subtenant-id:
      in: header
      name: x-optum-subtenant-id
      schema:
        type: string
        example: 5e2f9f4f-6f1d-4b37-92b5-6c5a9d1f8a21
      required: false
      description: (Optional) Identifies an Optum-assigned sub-tenant configuration for your organization. Include this header only when Optum has provided a value for a specific enabled customer configuration. Clients must not generate or infer this value.
    header-correlation-id:
      in: header
      name: x-optum-correlation-id
      schema:
        type: string
        example: 9fb77454-8c58-4345-aa50-43f133e06d20
      required: false
      description: (Optional) A unique identifier value that is attached to the response that allow reference to the original request. Differs from `x-optum-trace-id` as the correlation-id is stored within the datastore for future queryability.
  requestBodies:
    EligibilityRequestX12:
      description: New real-time eligibility transaction request using a JSON body whose `x12` field contains an X12 270 payload. The provider NPI in the X12 270 must be valid and follow standard NPI validation rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EligibilityRequestX12'
          examples:
            RTE X12 Request Feeding Coverage Discovery:
              $ref: '#/components/examples/RTEEligibilityRequestX12CoverageDiscoveryCandidate'
            RTE X12 Request Feeding HMO Discovery:
              $ref: '#/components/examples/RTEEligibilityRequestX12HMOCandidate'
      required: true
    EligibilityRequest:
      description: New real-time eligibility transaction request. `controlNumber` is optional; when omitted, Enhanced Eligibility generates one. `encounter.dateOfService` is required. The submitted provider NPI must be valid and follow standard NPI validation rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EligibilityRequest'
          examples:
            Eligibility Request Minimal:
              $ref: '#/components/examples/EligibilityRequestMinimal'
            Eligibility Request Expanded:
              $ref: '#/components/examples/EligibilityRequestExpanded'
            RTE JSON Request Feeding Coverage Discovery:
              $ref: '#/components/examples/RTEEligibilityRequestCoverageDiscoveryCandidate'
            RTE JSON Request Feeding HMO Discovery:
              $ref: '#/components/examples/RTEEligibilityRequestHMOCandidate'
      required: true
  securitySchemes:
    oAuth:
      type: oauth2
      description: This API uses OAuth 2 with the client_credentials grant flow. [More info](https://api.example.com/docs/auth)
      flows:
        clientCredentials:
          tokenUrl: /apip/auth/v2/token
          scopes:
            read_txn: read transactions
            create_txn: submit a new transaction request
            read_coveragediscovery: read coverage discovery tasks
            create_coveragediscovery: submit a new coverage discovery task
            read_healthcheck: check the status of the system
