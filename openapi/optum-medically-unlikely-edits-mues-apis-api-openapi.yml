openapi: 3.2.0
info:
  title: Optum Medically Unlikely Edits(MUEs) APIs API
  version: v1.0
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  description: 'Operations tagged Medically Unlikely Edits(MUEs) APIs across 2 of this provider''s published API definitions: optum-cms-common-facility-openapi.yml, optum-cms-common-physician-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1/cmscommonms
tags:
- name: Medically Unlikely Edits(MUEs) APIs
paths:
  /api/cms/{mueType}/mue:
    get:
      tags:
      - Medically Unlikely Edits(MUEs) APIs
      summary: Fetches the Medically Unlikely Edits table data for MUE Physician OR Facility
      operationId: getMueTableData
      parameters:
      - name: mueType
        in: path
        required: true
        schema:
          type: string
          enum:
          - physician
          - facility
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - name: sort
        in: query
        description: Any of these values (code, -code )are allowed.
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - code
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Fetch MUE list
          content:
            application/json:
              example:
                content:
                - code: 0001A
                  unit: '1'
                  mueAdjIndicator: '2 Date of Service Edit: Policy'
                  mueRationale: Code Descriptor / CPT Instruction
                - code: 0001U
                  unit: '1'
                  mueAdjIndicator: '2 Date of Service Edit: Policy'
                  mueRationale: Code Descriptor / CPT Instruction
                totalCount: 2
        '400':
          description: 'Bad Request: Some parameters were invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                error:
                - sort parameter value should be from list of [code]
                warning: null
                info: null
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2023-12-2T08:10:07.573+00:00'
                status: 500
                error: Internal Server Error
                message: 'Request processing failed: java.lang.IllegalArgumentException: Page size must not be less than one'
                path: /cmscommonms/api/cms/mue
      security:
      - bearerAuth: []
    servers:
    - url: /v1/cmscommonms
components:
  schemas:
    Notification:
      type: object
      properties:
        error:
          type: array
          items:
            type: string
        warning:
          type: array
          items:
            type: string
        info:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- optum-cms-common-facility-openapi.yml
- optum-cms-common-physician-openapi.yml
x-readme:
  explorer-enabled: true
  proxy-enabled: true
