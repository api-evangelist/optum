      type: object
      properties:
        clientOrderId:
          type: integer
          format: int64
        clientOrderStatus:
          type: string
        clientOrderStatusDetail:
          type: string
    clientOrderRequest:
      type: object
      required:
      - vendorType
      - tenantId
      - clientOrgId
      - campaignId
      - requestingPartyId
      - rosterFilePath
      - clientOrderName
      - serviceStartDate
      - serviceEndDate
      - vendors
      properties:
        vendorType:
          type: string
          description: Type of the vendor for which the order is placed. It can be either external or internal and should not have any other value.
        tenantId:
          type: integer
          format: int64
          description: NCC tenant ID for which the order is to be placed.
        clientOrgId:
          type: integer
          format: int64
          description: NCC Client org ID for which the order is to be placed.
        campaignId:
          type: integer
          format: int64
          description: Campaign ID to place order. Either one of campaignId or campaignName is required. If both are present, then preference will be given to campaign ID.
        campaignName:
          type: string
          description: Campaign name to place order. Either one of campaignId or campaignName is required. If both are present, then preference will be given to campaign ID.
        requestingPartyId:
          type: integer
          format: int64
          description: Requesting party ID to place order. Either one of requestingPartyId or requestingPartyName is required. If both are present, then preference will be given to requestingPartyId.
        requestingPartyName:
          type: string
          description: Requesting party name to place order. Either one of requestingPartyId or requestingPartyName is required. If both are present, then preference will be given to requestingPartyId.
        rosterFilePath:
          type: string
          description: The file path of ABS where the roster file is present. Roster file should be available at this location before placing the request.
        clientOrderName:
          type: string
          description: Unique name of the client order to be created.
        serviceStartDate:
          type: string
          format: date
          description: Service start date.
        serviceEndDate:
          type: string
          format: date
          description: Service end date.
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        statusMessage:
          type: string
        error:
          $ref: '#/components/schemas/Error'
    OrderMetric:
      type: object
      properties:
        count:
          type: integer
          format: int32
        downloadUrl:
          type: string
    OrderResult:
      type: object
      properties:
        cleanMetric:
          $ref: '#/components/schemas/OrderMetric'
        errorMetric:
          $ref: '#/components/schemas/OrderMetric'
        duplicateMetric:
          $ref: '#/components/schemas/OrderMetric'
    ApiResponseVendorOrderDetailsResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        statusMessage:
          type: string
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
        result:
          $ref: '#/components/schemas/VendorOrderDetailsResponse'
