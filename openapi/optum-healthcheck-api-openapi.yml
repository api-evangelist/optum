openapi: 3.2.0
info:
  title: Optum Health Check API
  version: '1.0'
  description: 'Operations tagged HealthCheck across 14 of this provider''s published API definitions: optum-abm-care-decision-support-api-openapi.yml, optum-auth-referral-submission-health-check-openapi.yml, optum-claim-actions-health-check-openapi.yml, optum-claim-inquiry-health-check-openapi.yml, optum-document-search-health-check-openapi.yml, optum-eligibility-pre-service-health-check-openapi.yml, optum-enhanced-eligibility-api-openapi.yml, optum-formatting-rule-api-openapi.yml, optum-optum-real-health-check-api-openapi.yml, optum-patient-benefit-check-health-check-openapi.yml, optum-real-dental-claim-submission-api-openapi.yml, optum-real-prior-authorization-api-openapi.yml, optum-real-provider-access-api-openapi.yml, optum-telecom-formatter-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox-apigw.optum.com
  description: ABM Care Decision Support API server
- url: https://apigw.optum.com
  description: Production server (uses live data)
- description: Generated server url
  url: https://sandbox-apigw.optum.com/rxn/formattingrules
- url: https://sandbox-apigw.optum.com/oihub
- description: Generated server url
  url: ' https://sandbox-apigw.optum.com/rxn/telecomformatter'
tags:
- name: HealthCheck
paths:
  /abm/dsrservicehc/v1:
    get:
      tags:
      - HealthCheck
      summary: Health check endpoint for the Decision Support API (GET /abm/dsrservicehc/v1)
      responses:
        '200':
          description: OK
    servers:
    - url: https://sandbox-apigw.optum.com
      description: ABM Care Decision Support API server
  /oihub/patient/auth/referral/v1/healthcheck:
    get:
      summary: Health Check
      description: Performs a health check to validate the availability and operational status of the  Auth Referral Submission Service.
      operationId: healthCheck
      security:
      - oAuth:
        - read_healthcheck
      tags:
      - HealthCheck
      responses:
        '200':
          description: Service is healthy - If the API engine is working correctly and if the entry points are accessible, the API operating status response shows "OK".
        '500':
          description: 'Service is unhealthy

            - **Note:** If you receive a response other than 200 OK, the health check failed. Please submit a ticket with Optum.

            '
    servers:
    - url: https://sandbox-apigw.optum.com
  /oihub/claim/actions/v1/healthcheck:
    get:
      summary: Health Check
      description: Performs a health check to validate the availability and operational status of the Claim Actions service.
