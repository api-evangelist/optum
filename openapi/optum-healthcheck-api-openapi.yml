  /pre-service/v1/healthcheck:
    get:
      summary: Health Check
      description: API Health Check - The health check endpoint checks the operating status of our APIs. It is a ping for the APIs entry point to ensure the entry points are accessible. This is the first thing you can do if something goes wrong.
