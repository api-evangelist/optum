components:
  schemas:
    AdditionalDocumentation:
      properties:
        additionalDocumentationTypeId:
          description: 006 - Medicare equals 04.04B Lymphedema Pumps, 007 - Medicare equals 04.05C Osteogenesis
            Stimulator, 008 - Medicare equals 06.03B Transcutaneous Electrical NerveStimulator (TENS),
            009 - Medicare equals 07.03A Seat Lift Mechanisms, 012 - Medicare equals 09.02 Infusion Pump,
            015 - Medicare equals 484.03 Oxygen, 016 - Medicare equals 10.03 Enteral and Parenteral Nutrition,
            017 - Medicare equals 11.02 Section C Continuation Form
          format: ncpdp-alphanumeric
          maxLength: 9
          type: string
        lengthOfNeed:
          $ref: '#/components/schemas/LengthOfNeed'
        prescriberOrSupplierDateSigned:
          example: '2023-10-01'
          format: rxn-date
          type: string
        question:
          items:
            $ref: '#/components/schemas/Question'
          type: array
        requestPeriodBeginDate:
          example: '2023-10-01'
          format: rxn-date
          type: string
        requestPeriodRecertOrRevisedDate:
          example: '2023-10-01'
          format: rxn-date
          type: string
        requestStatus:
          description: Code identifying type of request. 0 - Not Specified, 1 - Initial, 2 - Revision,
            3 - Recertification
          format: ncpdp-alphanumeric
          maxLength: 3
          type: string
        supportingDocumentation:
          format: ncpdp-alphanumeric
          maxLength: 195
          type: string
      type: object
    AdditionalDocumentationV1:
      properties:
        additionalDocumentationTypeId:
          description: 006 - Medicare equals 04.04B Lymphedema Pumps, 007 - Medicare equals 04.05C Osteogenesis
            Stimulator, 008 - Medicare equals 06.03B Transcutaneous Electrical NerveStimulator (TENS),
            009 - Medicare equals 07.03A Seat Lift Mechanisms, 012 - Medicare equals 09.02 Infusion Pump,
            015 - Medicare equals 484.03 Oxygen, 016 - Medicare equals 10.03 Enteral and Parenteral Nutrition,
            017 - Medicare equals 11.02 Section C Continuation Form
          errorMessage:
            format: invalid value, only printable characters are allowed.
            maxLength: exceeds the maximum limit of 9.
            type: invalid type, expected string.
          format: ncpdp-alphanumeric
          maxLength: 9
          type: string
        lengthOfNeed:
          errorMessage:
            minProperties: must have at least one property.
          minProperties: 1
          properties:
            days:
              errorMessage:
                maxLength: exceeds the maximum limit of 3.
                pattern: invalid value, only numeric characters are allowed.
                type: invalid type, expected string.
              maxLength: 3
              pattern: ^[0-9]*$
              type: string
            hours:
              errorMessage:
                maxLength: exceeds the maximum limit of 3.
                pattern: invalid value, only numeric characters are allowed.
                type: invalid type, expected string.
              maxLength: 3
              pattern: ^[0-9]*$
              type: string
            lifetime:
              errorMessage:
                maxLength: exceeds the maximum limit of 3.
                pattern: invalid value, only numeric characters are allowed.
                type: invalid type, expected string.
              maxLength: 3
              pattern: ^[0-9]*$
              type: string
            months:
              errorMessage:
                maxLength: exceeds the maximum limit of 3.
                pattern: invalid value, only numeric characters are allowed.
                type: invalid type, expected string.
              maxLength: 3
              pattern: ^[0-9]*$
              type: string
            weeks:
              errorMessage:
                maxLength: exceeds the maximum limit of 3.
                pattern: invalid value, only numeric characters are allowed.
                type: invalid type, expected string.
              maxLength: 3
              pattern: ^[0-9]*$
              type: string
            years:
              errorMessage:
                maxLength: exceeds the maximum limit of 3.
                pattern: invalid value, only numeric characters are allowed.
                type: invalid type, expected string.
              maxLength: 3
              pattern: ^[0-9]*$
              type: string
          required:
          - hours
          - days
          - weeks
          - months
          - years
          - lifetime
          type: object
        prescriberOrSupplierDateSigned:
          errorMessage:
            format: invalid date.
            type: invalid type, expected string.
          example: '2023-10-01'
          format: rxn-date
          type: string
        question:
          items:
            errorMessage:
              required:
                alphanumericResponse: alphanumericResponse is required.
                dateResponse: dateResponse is required.
                dollarAmountResponse: dollarAmountResponse is required.
                numberOrLetter: numberOrLetter is required.
                numericResponse: numericResponse is required.
                percentResponse: percentResponse is required.
            properties:
              alphanumericResponse:
                errorMessage:
                  format: invalid value, only printable characters are allowed.
                  maxLength: exceeds the maximum limit of 90.
                  type: invalid type, expected string.
                format: ncpdp-alphanumeric
                maxLength: 90
                type: string
              dateResponse:
                errorMessage:
                  format: invalid date.
                  type: invalid type, expected string.
                example: '2023-10-01'
                format: rxn-date
                type: string
              dollarAmountResponse:
                errorMessage:
                  maxLength: exceeds the maximum limit of 16.
                  pattern: not valid amount.
                  type: invalid type, expected string.
                maxLength: 16
                pattern: ^-?(\d{1,9}(?:[.]\d{1,6})?)?$
                type: string
              numberOrLetter:
                errorMessage:
                  format: invalid value, only printable characters are allowed.
                  maxLength: exceeds the maximum limit of 9.
                  type: invalid type, expected string.
                format: ncpdp-alphanumeric
                maxLength: 9
                type: string
              numericResponse:
                errorMessage:
                  maxLength: exceeds the maximum limit of 11.
                  pattern: invalid value,only numeric expected.
                  type: invalid type, expected string.
                maxLength: 11
                pattern: ^[0-9]*$
                type: string
              percentResponse:
                errorMessage:
                  maxLength: exceeds the maximum limit of 5.
                  pattern: not valid percent.
                  type: invalid type, expected string.
                maxLength: 5
                pattern: ^(\d{1,3}(?:[.]\d{1,2})?)?$
                type: string
            required:
            - numberOrLetter
            - percentResponse
            - dateResponse
            - dollarAmountResponse
            - numericResponse
            - alphanumericResponse
            type: object
          type: array
        requestPeriodBeginDate:
          errorMessage:
            format: invalid date.
            type: invalid type, expected string.
          example: '2023-10-01'
          format: rxn-date
          type: string
        requestPeriodRecertOrRevisedDate:
          errorMessage:
            format: invalid date.
            type: invalid type, expected string.
          example: '2023-10-01'
          format: rxn-date
          type: string
        requestStatus:
          description: Code identifying type of request. 0 - Not Specified, 1 - Initial, 2 - Revision,
            3 - Recertification
          errorMessage:
            format: invalid value, only printable characters are allowed.
            maxLength: exceeds the maximum limit of 3.
            type: invalid type, expected string.
          format: ncpdp-alphanumeric
          maxLength: 3
          type: string
        supportingDocumentation:
          errorMessage:
            format: invalid value, only printable characters are allowed.
            maxLength: exceeds the maximum limit of 195.
            type: invalid type, expected string.
          format: ncpdp-alphanumeric
          maxLength: 195
          type: string
