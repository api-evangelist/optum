externalDocs:
  description: Resource Docs
  url: https://springdoc.org/
info:
  description: API for Telecom Formatter
  title: Telecom Formatter API
  version: v1
openapi: 3.1.0
paths:
  /health/telecom-formatter:
    get:
      responses:
        '200':
          description: OK
      summary: Health check endpoint for the telecom-formatter
      tags:
      - HealthCheck
  /v1/formatDetails:
    post:
      description: This endpoint receives structured JSON data and transforms it into a formatted NCPDP
        (National Council for Prescription Drug Programs) string.
      operationId: formatDetails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelecomRequestV1'
        description: Request to format details
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NCPDPRequestConverterV1Response'
          description: Successful Response
        '401':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NCPDPRequestConverterV1Response'
          description: Unauthorized
      summary: Format Details
      tags:
      - Telecom Format
  /v1/telecomFormatResponse:
    post:
      description: This endpoint converts a raw NCPDP telecom message string into a structured JSON format.
        It is primarily used to parse and interpret NCPDP D.0 or similar telecom transaction formats,
        making the data easier to consume for downstream systems.
      operationId: formatIncomingData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NcpdpFormatRequestData'
        description: Request to telecom format Response
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NCPDPResponseConverterV1Response'
          description: Successful
        '401':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NCPDPResponseConverterV1Response'
          description: Unauthorized
      summary: NCPDP Format Request Data
      tags:
      - Telecom Format
security:
- oauth2_security: []
servers:
- description: Generated server url
  url: ' https://sandbox-apigw.optum.com/rxn/telecomformatter'
tags:
- description: API to format details received in a request
  name: Telecom Format
x-readme:
  explorer-enabled: true
  proxy-enabled: true
