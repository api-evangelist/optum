  /api/optum/facility/{docId}/mdc-optimizing-tips-download:
    get:
      tags:
      - MDC Optimizing Tips APIs
      summary: Fetches the file content for MDC optimization tips
      operationId: getMDCOptimizingTipsDocument
      parameters:
      - name: docId
        in: path
        description: MDC Optimization Document ID
        required: true
        schema:
          type: integer
          format: int32
        example: 492768
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Fetches the file content in the form of byte array, response headers and media
            type as FileType
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/Notification'
              example: "access-control-expose-headers: Content-Disposition \ncache-control: no-cache,no-store,max-age=0,must-revalidate\
                \ \nconnection: keep-alive \ncontent-disposition: attachment; filename=MDC_PRE \ncontent-encoding:\
                \ gzip \ncontent-type: application/pdf \ndate: Fri,13 Sep 2024 13:02:20 GMT \nexpires:\
                \ 0 \npragma: no-cache \ntransfer-encoding: chunked \nvary: Origin,Access-Control-Request-Method,Access-Control-Request-Headers\
                \ \nx-content-type-options: nosniff \nx-frame-options: DENY \nx-xss-protection: 0 \n"
        '404':
          description: 'Not found: Sub terms not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example: "{\n    \"timestamp\": \"2023-07-28T06:19:48.666+00:00\",\n    \"status\": 404,\n\
                \    \"error\": \"Not Found\",\n    \"message\": \"{\n                    \"error\": [\n\
                \                        \"No Data Found.\"\n                    ],\n                \
                \    \"warning\": null,\n                    \"info\": null\n                }\",\n  \
                \  \"path\": \"/optumcommonms/api/optum/facility/13131313/mdc-optimizing-tips-download\"\
                \n}"
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2023-07-28T06:19:48.666+00:00'
                path: optumcommonms/api/optum/facility/492768/mdc-optimizing-tips-download
                status: 500
                error: Internal Server Error
                requestId: a4796cc7-1
      security:
      - bearerAuth: []
