          description: 'POST: Fetches APC calculator '
          content:
            application/json:
              example:
                provider: '010001'
                fromDateStr: '2024-06-27'
                thruDateStr: '2024-06-27'
                gender: M
                age: '40'
                zipCode: ''
                dxCode: I10
                dxCodeType: icd10
                tobCode: '0131'
                conditionCode: ''
                claimLineList:
                - cptHcpcs: '99213'
                  unit: '1'
                  revCode: 0278
                  modifiers: ''
                  dateStr: '2024-06-27'
                  charge: '100'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
