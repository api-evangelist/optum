openapi: 3.0.1
info:
  title: Optum Common Facility
  description: MicroService that contains Optum module-related information
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  version: v1.0
servers:
- url: /v1/optumcommonms
paths:
  /app/optum/facility/claim/update:
    put:
      tags:
      - Facility Compliance APIs
      summary: Update the claim
      operationId: updateClaim
      parameters:
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityClaimUpdate'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
      security:
      - bearerAuth: []
  /app/optum/facility/claim/update-claim-line:
