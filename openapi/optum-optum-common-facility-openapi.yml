        in: path
        required: true
        schema:
          type: string
        example: K0001
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - name: sort
        in: query
        description: Any of these (code,-code, description, -description) are allowed values.
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - code
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossCodesRequest'
        required: true
      responses:
        '200':
          description: Fetch columns for cross coder I10cm tab
          content:
            application/json:
              example:
                content:
                - code: G43.001
                  rangeCodeType: 0
                  codeType: 0
                  description: Migraine without aura, not intractable, with status migrainosus
                  baseUnitValue: 0
                  source: Subject-Matter Expert Assigned
                  associatedCodeLinkList: []
                - code: G43.009
                  rangeCodeType: 0
                  codeType: 0
                  description: Migraine without aura, not intractable, without status migrainosus
                  baseUnitValue: 0
                  associatedCodeLinkList:
                  - value: A56273
                    href: https://www.cms.gov/medicare-coverage-database/view/article.aspx?articleid=56273&ver=26&bc=0
                totalCount: 2
                ncw: false
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error:
                - sort parameter value should be from list of [code, description]
                warning: null
                info: null
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2023-07-27T08:10:07.573+00:00'
                status: 500
                error: Internal Server Error
                message: 'Request processing failed: java.lang.UnsupportedOperationException: Unsupported
                  codetype in Method getFindListQuery.'
                path: /optumcommonms/api/optum/facility/cross-coder/list
      security:
      - bearerAuth: []
