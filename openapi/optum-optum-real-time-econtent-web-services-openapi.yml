                    from the autoimmune or other destruction of the pancreatic beta cells, which cease
                    producing insulin. This type is commonly seen at a young age and requires regular
                    insulin injections. Type II is caused by the body''s inability to respond to insulin
                    that is produced, called insulin resistance. The pancreas gradually loses the ability
                    to produce insulin. Type II is usually seen in adulthood and can often be treated
                    with diet, exercise, and oral medications. Type II may also require insulin, however,
