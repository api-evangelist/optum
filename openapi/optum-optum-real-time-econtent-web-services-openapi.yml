            application/json:
              schema:
                $ref: '#/components/schemas/ColorCodes'
              example:
                error:
                - Code 13104 does not exist
                warning: []
                info: []
        '405':
          description: Method Not Allowed - Request method not supported
          content:
            application/json:
              example:
                timestamp: '2022-07-07T15:28:34.152Z'
                status: 405
                error: Method Not Allowed
        '503':
          description: Service Unavailable
  /codetype/{codetype}/{code}/{crosscodetype}:
    get:
      tags:
      - OPPS CrossCode Code
      summary: Show OPPS CrossCode for the Code
      operationId: getOPPSCrossCode
      parameters:
      - name: codetype
        in: path
        description: The codetype needed to identify the type of code
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
      - name: code
        in: path
        description: The code for which you want OPPS crosscode
        required: true
        schema:
          type: string
      - name: crosscodetype
        in: path
        description: The cross-code for the given codetype
        required: true
        schema:
          type: string
        example: icd9v1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OPPSCrossCode'
              example: "{\n    \"oppscrosscode\": [\n        {\n    \"Code\": 27096,\n            \"Description\"\
                : \"Injection procedure for sacroiliac joint, anesthetic/steroid, with image guidance\
                \ (fluoroscopy or CT) including arthrography when performed,\"\n            \"Reference\
                \ Cross Code\": G0259,G0260,\n            \"Effective Date\": \"\x01/01/2000\"\n     \
                \   }\n    ]\n}"
        '400':
          description: Bad data parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OPPSCrossCode'
              example:
                error:
                - Bad data parameter 'bad'
                warning: []
                info: []
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
          description: OPPS crosscode was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OPPSCrossCode'
              example:
                error: []
                warning: []
                info:
                - OPPS crosscode was not found.
        '405':
          description: Method Not Allowed - Request method not supported
          content:
