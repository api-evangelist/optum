openapi: 3.0.1
info:
  title: Optum Real-Time eContent Web services
  description: Optum® Real-Time eContent web services provides access to both ondemand medical coding
    data and Optum coding tool logic required by your applications. The information you or your clients
    need is delivered to your application in real time, when you need it, and customized to how you want
    it displayed. Optum Real-Time eContent service provides access to the content of 37 printed coding
    resources and proprietary data and offers the power of the Optum CodeLogic™ search engine.
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  version: 1.0.0
servers:
- url: sandbox-apigw.optum.com/ci/rtec/v1/ws
security:
- bearerAuth: []
paths:
  /codetype/{codetype}/{code}/anesbaseunit:
    get:
      tags:
      - Code Information
      summary: Return base units for the given CPT Anesthesia {code}
      operationId: getAnesBaseUnit
      parameters:
      - name: codetype
        in: path
        description: The codetype needed to identify the type of code
        required: true
        schema:
          type: string
          enum:
          - cpt
      - name: code
        in: path
        description: The code value for the respective codetype
        required: true
        schema:
          type: string
        example: '00100'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items'
              example:
                item:
                - '5'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items'
              example:
                error:
                - The code provided ('A0021') in this web service request is not a valid 'cpt' code.
                warning: []
                info: []
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
          description: Not Found - the data was not found
          content:
            application/json:
              example:
                error:
                - The requested resource does not exist.
                warning: []
                info: []
        '405':
          description: Method Not Allowed - Request method not supported
          content:
            application/json:
              example:
                timestamp: '2022-07-07T15:28:34.152Z'
                status: 405
                error: Method Not Allowed
        '503':
          description: Service Unavailable
  /codetype/{codetype}/{code}/{facNonFac}:
    get:
      tags:
      - Code Information
      summary: Return code range
      operationId: getColumnCci
      parameters:
      - name: code
        in: path
        description: The code for which you want CCI data
        required: true
        schema:
          type: string
        example: 13100
      - name: codetype
        in: path
        description: The codetype needed to identify the type of code
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
      - name: facNonFac
        in: path
        description: One of<UL><LI>facility-cci</LI><LI>non-facility-cci</LI></UL>
        required: true
        schema:
          type: string
          enum:
          - facility-cci
          - non-facility-cci
      - name: data
        in: query
        description: 'Comma seperated list of<UL><LI>reason : e.g. Anesthesia Included in Surgical Procedure</LI><LI>modifier-allowed
          : e.g. true</LI><LI>modifier-allowed : e.g. true</LI></UL>'
        schema:
          type: string
        example: reason,modifier-allowed
      - name: types
        in: query
        description: 'Comma seperated list of<UL><LI>cci-column2 : procedures that are included</LI><LI>cci-column1
          : procedures in which this is included</LI><LI>cci-all : All of the above 2 types </LI></UL>'
        schema:
          type: string
          default: cci-all
        example: cci-all,cci-column2,cci-column1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cci'
              example:
                cciColumn2:
                - code: 0213T
                  href: /ws/codetype/cpt/0213T
                - code: 0216T
                  href: /ws/codetype/cpt/0216T
                cciColumn1: []
        '400':
          description: Unknown data element
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cci'
              example:
                error:
                - 'Unknown data element : bad'
                warning: []
                info: []
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
          description: Code does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cci'
              example:
                error:
                - Code '13104' does not exist
                warning: []
                info: []
        '405':
          description: Method Not Allowed - Request method not supported
          content:
            application/json:
              example:
                timestamp: '2022-07-07T15:28:34.152Z'
                status: 405
                error: Method Not Allowed
        '503':
          description: Service Unavailable
  /codetype/{codetype}/{code}/cdi:
    get:
      tags:
      - CDI Information
      summary: Return the list of CDI documents for the given code
      operationId: getCDICodeLinks
      parameters:
      - name: codetype
        in: path
        description: The codetype needed to identify the type of code
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
          - icd9v1
          - icd9v3
          - icd10cm
          - icd10pcs
      - name: code
        in: path
        description: The code value
        required: true
        schema:
          type: string
        example: 99213
      - name: data
        in: query
        description: <b>associatedcodes</b> indicates will include a comma separated list of Codes associated
          to CDI.
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cdi'
              example:
                cdiDoc:
                - url: /documents/550392
                  pdftitle: 'Lower Extremity Endovascular Revascularization:'
                  sourcetitle: Facility Documentation Improvement Instructions
                - url: /documents/59046
                  pdftitle: Percutaneous Coronary Interventions (PTCA and Atherectomy, with or without
                    Stent Placement)
                  sourcetitle: Facility Documentation Improvement Instructions
        '400':
          description: Wrong CodeType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cdi'
              example:
                error:
                - The code provided ('0019T') in this web service request is not a valid 'hcpcs' code.
                warning: []
                info: []
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
          description: CDI Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cdi'
              example:
                error: []
                warning: []
                info:
                - CDI Document not found for the code entered.
        '405':
          description: Method Not Allowed - Request method not supported
          content:
            application/json:
              example:
                timestamp: '2022-07-07T15:28:34.152Z'
                status: 405
                error: Method Not Allowed
        '503':
          description: Service Unavailable
  /documents/{docId}:
    get:
      tags:
      - CDI and Coding Support PDF Information
      summary: Return the CDI and Coding Support PDF Document
      operationId: getCDIPDF
      parameters:
      - name: docId
        in: path
        description: The Document Id (max 6 chars)
        required: true
        schema:
          type: integer
          format: int32
        example: 470866
      responses:
        '200':
          description: Successful Response
          content:
            application/pdf:
              schema:
                type: string
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
          description: CDI or Coding Support PDF Document not found
          content:
            application/pdf:
              schema:
                type: string
              example: CDI or Coding Support PDF Document not found
        '405':
          description: Method Not Allowed - Request method not supported
          content:
            application/json:
              example:
                timestamp: '2022-07-07T15:28:34.152Z'
                status: 405
                error: Method Not Allowed
        '503':
          description: Service Unavailable
  /icd10physdoc/{docId}:
    get:
      tags:
      - CDI Information
      summary: Return the ICD10 Physician CDI PDF Document
      operationId: getCDIPDF_1
      parameters:
      - name: docId
        in: path
        description: The Document Id (max 3 chars)
        required: true
        schema:
          type: integer
          format: int32
        example: 638
      responses:
        '200':
          description: Successful Response
          content:
            application/pdf:
              schema:
                type: string
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
          description: CDI Document not found
          content:
            application/pdf:
              schema:
                type: string
              example: CDI Document not found
        '405':
          description: Method Not Allowed - Request method not supported
          content:
            application/json:
              example:
                timestamp: '2022-07-07T15:28:34.152Z'
                status: 405
                error: Method Not Allowed
        '503':
          description: Service Unavailable
  /claims5x:
    get:
      tags:
      - Claim Review
      summary: Get Claims Information
      operationId: getClaims
      responses:
        '200':
          description: Successful Response
          content:
            application/xml:
              schema:
                type: string
              example: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<claims>\n  <claim id=\"1\">\n   \
                \ <claim-line diagnostic-type='icd10cm'>\n      <service-begin-date>2009-07-16</service-begin-date>\n\
                \      <diagnostic-code>E10.9</diagnostic-code>\n      <diagnostic-code>E10.19</diagnostic-code>\n\
                \      <modifier>21</modifier>\n      <modifier>51</modifier>\n      <procedure-code>13100</procedure-code>\n\
                \    </claim-line>\n    <claim-line diagnostic-type='icd10cm'>\n      <service-begin-date>2009-07-16</service-begin-date>\n\
                \      <diagnostic-code>E10.9</diagnostic-code>\n      <diagnostic-code>250.01</diagnostic-code>\n\
                \      <modifier>21</modifier>\n      <modifier>51</modifier>\n      <procedure-code>13100</procedure-code>\n\
                \      <place-of-service>11</place-of-service>\n      <units>1</units>\n    </claim-line>\n\
                \    <birth-date>2009-07-16</birth-date>\n    <service-date>2009-07-16</service-date>\n\
                \    <gender>M</gender>\n    <payer>10102</payer>\n    <taxonomy>208600000X</taxonomy>\n\
                \  </claim>\n</claims>"
        '401':
          description: Not Authorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponses'
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
    post:
      tags:
      - Claim Review
      summary: Get Claims Responses
      operationId: process
      requestBody:
        description: Term Search Request.
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/ClaimResponses'
            examples:
              Claim Request:
                description: Claim Request
                value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<claims>\n  <claim id=\"1\">\n   \
                  \ <claim-line diagnostic-type='icd10cm'>\n      <service-begin-date>2009-07-16</service-begin-date>\n\
                  \      <diagnostic-code>E10.9</diagnostic-code>\n      <diagnostic-code>E10.19</diagnostic-code>\n\
                  \      <modifier>21</modifier>\n      <modifier>51</modifier>\n      <procedure-code>13100</procedure-code>\n\
                  \    </claim-line>\n    <claim-line diagnostic-type='icd10cm'>\n      <service-begin-date>2009-07-16</service-begin-date>\n\
                  \      <diagnostic-code>E10.9</diagnostic-code>\n      <diagnostic-code>250.01</diagnostic-code>\n\
                  \      <modifier>21</modifier>\n      <modifier>51</modifier>\n      <procedure-code>13100</procedure-code>\n\
                  \      <place-of-service>11</place-of-service>\n      <units>1</units>\n    </claim-line>\n\
                  \    <birth-date>2009-07-16</birth-date>\n    <service-date>2009-07-16</service-date>\n\
                  \    <gender>M</gender>\n    <payer>10102</payer>\n    <taxonomy>208600000X</taxonomy>\n\
                  \  </claim>\n</claims>"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponses'
              example:
                claimResponse:
                - edit:
                  - description: '[Pattern 8400] The diagnosis code(s) E1019 and E109 are invalid.'
                    editConflict: Invalid Diagnosis Code
                    editType: Review
                    mnemonic: ICD
                    line: 1
                  - description: '[Pattern 13248] The modifier code(s) 21 are invalid.'
                    editConflict: Invalid Modifier
                    editType: Review
                    mnemonic: IMO
                    line: 1
                  - description: '[Pattern 8400] The diagnosis code(s) 25001 and E109 are invalid.'
                    editConflict: Invalid Diagnosis Code
                    editType: Review
                    mnemonic: ICD
                    line: 2
                  - description: '[Pattern 13248] The modifier code(s) 21 are invalid.'
                    editConflict: Invalid Modifier
                    editType: Review
                    mnemonic: IMO
                    line: 2
                  claimId: '1'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponses'
              example: "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<notifications>\n\
                \    <error>Unexpected close tag &lt;/servce-date&gt;; expected &lt;/service-date&gt;.\n\
                \ at [row,col {unknown-source}]: [48,41]</error>\n</notifications>"
        '401':
          description: Not Authorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponses'
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
  /codetype/{codetype}/{code}/codehistory:
    get:
      tags:
      - Code Information
      summary: Return Code History for the given cpt/hcpcs/icd9v3/icd9v1/icd10cm/icd10pcs {code}
      operationId: getCodehistory
      parameters:
      - name: codetype
        in: path
        description: The codetype needed to identify the type of code
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
          - icd9v1
          - icd9v3
          - icd10cm
          - icd10pcs
      - name: code
        in: path
        description: The code for which you want CCI data
        required: true
        schema:
          type: string
        example: 99213
      - name: yyyy-mm-dd
        in: header
        description: Historical Application Content(HAC) is not applicable here. This Code history webservice
          accepts Current date or future date only. For Current date, date is optional. For Future date,
          date must be provided
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteCodeHistory'
              example:
                codeHistory:
                - changeEffectiveDate: 01/01/2021
                  status: Changed
                  changeSummary: Officially recognized, Other, Changed
                  fullInfo: <P><FONT color=blue>Office or other outpatient visit for the evaluation and
                    management of an established patient, which requires a medically appropriate history
                    and/or examination and low level of medical decision making. When using time for code
                    selection, 20-29 minutes of total time is spent on the date of the encounter.</FONT><FONT
                    color=red><STRIKE>EST OUTPT L3 EXP PROB H&E LOW COMPLX MED DEC</STRIKE></FONT>
                  char48Info: <P><FONT color=blue>OFFICE</FONT><FONT color=red><STRIKE>OFC</STRIKE></FONT>/<FONT
                    color=blue>OUTPATIENT ESTABLISHED LOW</FONT><FONT color=red><STRIKE>OUTPT VISIT E&M
                    EST</STRIKE></FONT> <FONT color=blue>MDM 20</FONT>-<FONT color=blue>29</FONT><FONT
                    color=red><STRIKE>MOD SEVERITY 15</STRIKE></FONT> MIN
                  char35Info: <P><FONT color=blue>OFFICE O</FONT><FONT color=red><STRIKE>OFC</STRIKE></FONT>/<FONT
                    color=blue>P EST LOW</FONT><FONT color=red><STRIKE>OUTPT E&M ESTAB</STRIKE></FONT>
                    <FONT color=blue>20</FONT>-<FONT color=blue>29</FONT><FONT color=red><STRIKE>MOD 15</STRIKE></FONT>
                    MIN
                  codeHistoryReferences: {}
        '400':
          description: Wrong codetype
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteCodeHistory'
              example:
                error:
                - The code provided ('250.0') in this web service request is not a valid 'cpt' code.
                warning: []
                info: []
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
          description: Code does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteCodeHistory'
              example:
                error:
                - Code '13108' does not exist
                warning: []
                info: []
        '405':
          description: Method Not Allowed - Request method not supported
          content:
            application/json:
              example:
                timestamp: '2022-07-07T15:28:34.152Z'
                status: 405
                error: Method Not Allowed
        '503':
          description: Service Unavailable
  /codetype/{codetype}/{code}/properties:
    get:
      tags:
      - Code Information
      summary: Show properties for the given {codetype} and {code} parameter
      operationId: getProperty
      parameters:
      - name: codetype
        in: path
        description: The codetype needed to identify the type of code
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
          - icd9v1
          - icd9v3
          - icd10cm
          - icd10pcs
      - name: code
        in: path
        description: The code to search
        required: true
        schema:
          type: string
        example: 99213
      - name: yyyy-mm-dd
        in: header
        description: The Properties webservice accepts Current date or future date only. For Current date,
          date is optional. For Future date, date must be provided
        schema:
          type: string
      - name: data
        in: query
        description: 'Comma seperated list of any of the following<UL><LI>desc-35 : up to 35 character
          description (except 3rd or 4th digit ICD-10-PCS)</LI><LI>desc-48 : up to 48 character description
          (except 3rd or 4th digit ICD-10-PCS)</LI><LI>desc-255 : up to 255 character description (except
          3rd or 4th digit ICD-10-PCS)</LI><LI>desc-full : full description </LI><LI>desc-lay : Lay description
          (only for cpt/hcpcs/icd9v1/icd10cm)</LI><LI>coding-tip</LI><LI>documentation-tip</LI><LI>reimbursement-tip</LI></UL>'
        schema:
          type: string
          default: desc-full
        example: desc-full
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeProperties'
              example:
                descFull: Central Nervous System and Cranial Nerves, Bypass
        '400':
          description: Wrong CodeType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeProperties'
              example:
                error:
                - Bad data parameter 'bad'
                warning: []
                info: []
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
          description: Code does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeProperties'
              example:
                error:
                - Code '13104' does not exist
                warning: []
                info: []
        '405':
          description: Method Not Allowed - Request method not supported
          content:
            application/json:
              example:
                timestamp: '2022-07-07T15:28:34.152Z'
                status: 405
                error: Method Not Allowed
        '503':
          description: Service Unavailable
