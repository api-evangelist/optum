  /codetype/{codetype}/{code}/range:
    get:
      tags:
      - Reference Code
      summary: Return code range
      operationId: findRange
      parameters:
      - name: codetype
        in: path
        description: The codetype needed to identify the type of code
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
          - icd9v1
          - icd9v3
          - icd10cm
          - icd10pcs
      - name: code
        in: path
        description: Code to find the range
        required: true
        schema:
          pattern: '[^/]+'
          type: string
        example: 99213
      - name: rangeId
        in: query
        description: 'Internal use: used for finding next/previous range'
        schema:
          type: integer
          format: int32
        example: 1
      - name: direction
        in: query
        description: 'Internal use: one of<UL><LI>next: next range</LI><LI>previous: previous range</LI></UL>'
        schema:
          type: string
        example: next
      - name: data
        in: query
        description: 'Comma seperated list of any of the following<UL><LI>desc-full        : full description
          </LI><LI>headers          : Headers from the Code Book separated by ^</LI><LI>tabulardata :
          Tabular data from the Code Book separated by ^.  It shown in the pattern of ^<&lt;Tab Name&gt;>^<&lt;Indent
          Level 1&gt;>^<&lt;Indent Level 2&gt;>^<&lt;Tabular Text&gt;>^<&lt;Links&gt;>^.  For Example,
          One of the Tabular data for ICD-9-V1 code ''474.1'' is rendered as ''^Excludes A^4.3^null^adenoiditis^
          |[474.01]^''.  Here, Tab Name=Excludes A; Indent Level 1=4.3; Indent Level 2=null; Tabular Text=adenoiditis;
          Links=|[474.01].   </LI><LI>billableonly: to request return of billable codes only (no  digit
          color code edit exists for that code)    </LI></UL>'
        schema:
          type: string
          default: desc-full
        example: desc-full
      - name: yyyy-mm-dd
        in: header
        description: Historical Application Content(HAC) is not applicable here. This RangeResource webservice
          accepts Current or Future date only. For Current date, date is optional. For Future date, date
          must be provided
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRange'
              example:
                rangeId: 1
                rangeItem:
                - code: '99202'
                  description: Office or other outpatient visit for the evaluation and management of a
                    new patient, which requires a medically appropriate history and/or examination and
                    straightforward medical decision making. When using time for code selection, 15-29
                    minutes of total time is spent on the date of the encounter.
                  href: /ws/codetype/cpt/99202
                - code: '99203'
                  description: Office or other outpatient visit for the evaluation and management of a
                    new patient, which requires a medically appropriate history and/or examination and
                    low level of medical decision making. When using time for code selection, 30-44 minutes
                    of total time is spent on the date of the encounter.
                  href: /ws/codetype/cpt/99203
                link:
                - href: /ws/codetype/cpt/99202/range?rangeId=1&direction=next&data=desc-full
                  value: Next
        '400':
          description: Not a valid 'codetype' code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRange'
              example:
                error:
                - The code provided ('250.02') in this web service request is not a valid 'cpt' code.
                warning: []
                info: []
        '401':
          description: Not Authorized
          content:
            application/json:
              example:
                timestamp: '2022-07-06T16:34:39.385Z'
                error: Unauthorized
                status: 401
        '404':
