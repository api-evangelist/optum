components:
  headers:
    x-amzn-trace-id:
      description: Generated traceId of the request
      required: true
      example: Root=1-61d7441a-56e4c77350687b5230e5707
      schema:
        type: string
    transaction-id:
      description: Transaction Id of the request
      required: true
      schema:
        type: string
        format: uuid
        example: c9476bc2-b563-4555-9527-4afe9dccaf9a
  schemas:
    InquiryX12Request:
      type: object
