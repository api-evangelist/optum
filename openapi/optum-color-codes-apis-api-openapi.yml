        in: path
        required: true
        schema:
          type: string
          enum:
          - i9v1
          - i9v3
      - name: sort
        in: query
        description: Any of these (code,-code) are allowed values.
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 150
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-mm-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-mm-dd
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OptumPageImplColorCodes'
