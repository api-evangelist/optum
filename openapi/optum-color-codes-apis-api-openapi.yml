      summary: Fetches new , revised or deleted color codes
      operationId: fetchColorCodes
      parameters:
      - name: codetype
        in: path
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
          - i10_cm
          - i10_pcs
      - name: color-code-type
        in: path
        required: true
        schema:
          type: string
          enum:
          - new
          - revised
          - deleted
      - name: sort
        in: query
        description: Any of these (code,-code,effectiveDate,-effectiveDate) are allowed values.
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - -effectiveDate
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 150
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-mm-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-mm-dd
      responses:
        '200':
          description: Fetch new CPT color codes
          content:
            application/json:
              example:
                content:
                - code: 0364U
                  fullDescription: Oncology (hematolymphoid neoplasm), genomic sequence analysis using multiplex (pcr) and next-generation sequencing with algorithm, quantification of dominant clonal sequence(s), reported as presence or absence of minimal residual disease (mrd) with quantitation of disease burden, when appropriate
                  effectiveDate: '2023-04-01 00:00:00'
                - code: 0365U
                  fullDescription: Oncology (bladder), analysis of 10 protein biomarkers (a1at, ang, apoe, ca9, il8, mmp9, mmp10, pai1, sdc1 and vegfa) by immunoassays, urine, algorithm reported as a probability of bladder cancer
                  effectiveDate: '2023-04-01 00:00:00'
                - code: 0366U
                  fullDescription: Oncology (bladder), analysis of 10 protein biomarkers (a1at, ang, apoe, ca9, il8, mmp9, mmp10, pai1, sdc1 and vegfa) by immunoassays, urine, algorithm reported as a probability of recurrent bladder cancer
                  effectiveDate: '2023-04-01 00:00:00'
                - code: 0367U
                  fullDescription: Oncology (bladder), analysis of 10 protein biomarkers (a1at, ang, apoe, ca9, il8, mmp9, mmp10, pai1, sdc1 and vegfa) by immunoassays, urine, diagnostic algorithm reported as a risk score for probability of rapid recurrence of recurrent or persistent cancer following transurethral resection
                  effectiveDate: '2023-04-01 00:00:00'
                - code: 0368U
                  fullDescription: Oncology (colorectal cancer), evaluation for mutations of apc, braf, ctnnb1, kras, nras, pik3ca, smad4, and tp53, and methylation markers (myo1g, kcnq5, c9orf50, fli1, clip4, znf132 and twist1), multiplex quantitative polymerase chain reaction (qpcr), circulating cell-free dna (cfdna), plasma, report of risk score for advanced adenoma or colorectal cancer
                  effectiveDate: '2023-04-01 00:00:00'
                totalCount: 277
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2022-07-06T07:22:01.017+00:00'
                path: /api/coding/code/cpt/color-codes/new
                status: 500
                error: Internal Server Error
                requestId: a4796cc7-1
      security:
      - bearerAuth: []
