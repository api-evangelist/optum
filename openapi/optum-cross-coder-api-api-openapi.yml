                status: 500
                error: Internal Server Error
                message: 'Request processing failed: java.lang.UnsupportedOperationException: Unsupported codetype in Method getFindListQuery.'
                path: /optumcommonms/api/optum/facility/cross-coder/list
      security:
      - bearerAuth: []
    servers:
    - url: /v1/optumcommonms
components:
  schemas:
    CrossCodesRequest:
      type: object
      properties:
        isLcdNcdData:
          type: string
        isSmeaData:
          type: string
        isClaimsData:
          type: string
        macType:
          type: string
        contractorId:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
