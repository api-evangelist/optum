      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Fetch columns for cross coder
          content:
            application/json:
              example:
                content:
                - code: A9270
                  rangeCodeType: 0
                  codeType: 0
                  description: Noncovered item or service
                  baseUnitValue: 0
                - code: V2632
                  rangeCodeType: 0
                  codeType: 0
                  description: Posterior chamber intraocular lens
                  baseUnitValue: 0
                totalCount: 2
                ncw: false
        '400':
          description: Bad request
          content:
            application/json:
              example:
                error:
                - sort parameter value should be from list of [code, description]
                warning: null
                info: null
        '500':
          description: Internal server error
