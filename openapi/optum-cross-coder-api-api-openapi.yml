  /api/optum/common/cross-coder/list/{codetype}/{code}/{tab}:
    get:
      tags:
      - Cross Coder API
      summary: Fetches cross coder table data
      operationId: getCrossCoderDataList
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        example: 17000
      - name: codetype
        in: path
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
          - i10_pcs
          - i10_cm
          - i9v1
          - i9v3
        example: cpt
      - name: tab
        in: path
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
          - anesthesia_codes
          - i10_pcs
          - medicine_codes
          - dental
        example: hcpcs
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - name: sort
        in: query
        description: Any of these values (code,-code, description, -description) are allowed.
        required: false
        schema:
          type: array
          items:
            type: string
          default:
