openapi: 3.2.0
info:
  title: Core Service Code Book APIs API
  description: Code Search Service provides the APIs for searching codes related information.
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  version: v1.0
servers:
- url: /v1/codesearchms
tags:
- name: Code Book APIs
paths:
  /api/coding/code/book/{codeType}:
    get:
      tags:
      - Code Book APIs
      summary: Fetch the code book for the given code type
      operationId: fetchCodeBook
      parameters:
      - name: codeType
        in: path
        required: true
        schema:
          type: string
          enum:
          - i9v1
          - i9v3
          - cpt
          - hcpcs
          - i10_cm
      - name: isDental
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: yyyy-mm-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-mm-dd
      responses:
        '200':
          description: Code book of hcpcs code type
          content:
            application/json:
              example:
              - codeBeg: A0021
                codeEnd: A0999
                styleLevel: 0
                header: Transportation Services Including Ambulance
                codeBook:
                - codeBeg: A0021
                  codeEnd: A0999
                  styleLevel: 1
                  header: Transportation Services Including Ambulance
                  codeBook:
                  - codeBeg: A0021
                    codeEnd: A0398
                    styleLevel: 2
                    header: Ambulance Transport and Supplies
                  - codeBeg: A0420
                    codeEnd: A0420
                    styleLevel: 2
                    header: Waiting Time
                  - codeBeg: A0422
                    codeEnd: A0999
                    styleLevel: 2
                    header: Other Ambulance Services
              - codeBeg: A2001
