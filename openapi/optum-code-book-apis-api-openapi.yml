                styleLevel: 0
                header: Medical and Surgical Supplies
                codeBook:
                - codeBeg: A2001
                  codeEnd: A9999
                  styleLevel: 1
                  header: Medical and Surgical Supplies
                  codeBook:
                  - codeBeg: A2001
