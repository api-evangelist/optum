              example:
                timestamp: '2022-07-06T07:22:01.017+00:00'
                path: /api/coding/code/book/hcpcs
                status: 500
                error: Internal Server Error
                requestId: a4796cc7-1
      security:
      - bearerAuth: []
  /api/coding/code/book/i10_pcs:
    get:
      tags:
      - Code Book APIs
      summary: Fetch the code book for the given pcs code type
      operationId: fetchPcsCodeBook
      parameters:
      - name: section
        in: query
        required: false
        schema:
          type: string
      - name: body
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-mm-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-mm-dd
      responses:
        '200':
          description: Code book of pcs code type
          content:
            application/json:
              example:
              - id: 90810
                title: 0 Medical and Surgical
              - id: 90810
                title: 1 Obstetrics
              - id: 90810
                title: 2 Placement
              - id: 90810
                title: 3 Administration
              - id: 90810
                title: 4 Measurement and Monitoring
              - id: 90810
                title: 5 Extracorporeal or Systemic Assistance and Performance
              - id: 90810
                title: 6 Extracorporeal or Systemic Therapies
              - id: 90810
                title: 7 Osteopathic
              - id: 90810
                title: 8 Other Procedures
              - id: 90810
                title: 9 Chiropractic
              - id: 90810
                title: B Imaging
              - id: 90810
                title: C Nuclear Medicine
              - id: 90810
                title: D Radiation Therapy
              - id: 90810
                title: F Physical Rehabilitation and Diagnostic Audiology
              - id: 90810
                title: G Mental Health
              - id: 90810
                title: H Substance Abuse Treatment
              - id: 90810
                title: X New Technology
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2022-07-06T07:22:01.017+00:00'
                path: /api/coding/code/book/i10_pcs
                status: 500
                error: Internal Server Error
                requestId: a4796cc7-1
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-readme:
  explorer-enabled: true
  proxy-enabled: true
