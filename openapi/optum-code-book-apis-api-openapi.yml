                    styleLevel: 2
                    header: Skin Substitutes
                  - codeBeg: A4206
                    codeEnd: A4232
                    styleLevel: 2
                    header: Injection Supplies
                  - codeBeg: A4233
                    codeEnd: A4236
                    styleLevel: 2
                    header: Batteries
                  - codeBeg: A4238
