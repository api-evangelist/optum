  /api/cms/common/fee-schedule/zip-code/{state}:
    get:
      tags:
      - DME and PEN Fee Schedule APIs
      summary: Fetches rural ZIP codes available for given state
      operationId: getZipCodes
      parameters:
      - name: state
        in: path
        description: State
        required: true
        schema:
          type: string
        example: AL
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Fetch DME fees for all states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                content:
                - zipCode: '35010'
                - zipCode: '35011'
                - zipCode: '35014'
                - zipCode: '35016'
                - zipCode: '35019'
                totalCount: 5
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                error:
                - 'getZipCodes.filter: length must be between 2 and 30'
                warning: null
                info: null
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2023-07-13T06:36:22.518+00:00'
                path: /cmscommonms/api/cms/common/fee-schedule/zip-codes/AL
                status: 500
                error: Internal Server Error
                requestId: e36d239e-324
      security:
      - bearerAuth: []
    servers:
    - url: /v1/cmscommonms
components:
  schemas:
    Notification:
      type: object
      properties:
        error:
          type: array
          items:
            type: string
        warning:
          type: array
          items:
            type: string
        info:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
