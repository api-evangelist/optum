openapi: 3.2.0
info:
  title: Optum DME and PEN Fee Schedule APIs API
  version: v1.0
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  description: 'Operations tagged DME and PEN Fee Schedule APIs across 2 of this provider''s published API definitions: optum-cms-common-facility-openapi.yml, optum-cms-common-physician-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1/cmscommonms
tags:
- name: DME and PEN Fee Schedule APIs
paths:
  /api/cms/common/fee-schedule/{fee-schedule-type}:
    get:
      tags:
      - DME and PEN Fee Schedule APIs
      summary: Fetches DME or PEN fee schedule for all states
      operationId: getOutpatientFees
      parameters:
      - name: fee-schedule-type
        in: path
        required: true
        schema:
          type: string
          enum:
          - DME
          - PEN
      - name: sort
        in: query
        description: Any of these (code,-code,modifier,-modifier,modifier2,-modifier2,category,-category,state,-state,nonRuralFee,-nonRuralFee,ruralFee,-ruralFee) are allowed values.
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - code
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Fetch DME/PEN fees for all states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                content:
                - code: A4216
                  codeDescription: Sterile water, saline and/or dextrose, diluent/flush, 10 ml
                  category: OS
                  state: AZ
                  nonRuralFee: '0.58'
                  ruralFee: '0.00'
                - code: A4216
                  codeDescription: Sterile water, saline and/or dextrose, diluent/flush, 10 ml
                  category: OS
                  state: CA
                  nonRuralFee: '0.59'
                  ruralFee: '0.00'
                - code: A4216
                  codeDescription: Sterile water, saline and/or dextrose, diluent/flush, 10 ml
                  category: OS
                  state: CO
                  nonRuralFee: '0.59'
                  ruralFee: '0.00'
                - code: A4216
                  codeDescription: Sterile water, saline and/or dextrose, diluent/flush, 10 ml
                  category: OS
                  state: CT
                  nonRuralFee: '0.59'
                  ruralFee: '0.00'
                - code: A4216
                  codeDescription: Sterile water, saline and/or dextrose, diluent/flush, 10 ml
                  category: OS
                  state: DC
                  nonRuralFee: '0.59'
                  ruralFee: '0.00'
                - code: A4216
                  codeDescription: Sterile water, saline and/or dextrose, diluent/flush, 10 ml
                  category: OS
                  state: DE
                  nonRuralFee: '0.59'
                  ruralFee: '0.00'
                - code: A4216
                  codeDescription: Sterile water, saline and/or dextrose, diluent/flush, 10 ml
                  category: OS
                  state: FL
                  nonRuralFee: '0.55'
                  ruralFee: '0.00'
                - code: A4216
                  codeDescription: Sterile water, saline and/or dextrose, diluent/flush, 10 ml
                  category: OS
                  state: GA
                  nonRuralFee: '0.59'
                  ruralFee: '0.00'
                totalCount: 2
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                timestamp: '2023-08-14T16:46:24.623+00:00'
                status: 400
                error: Bad Request
                path: /cmscommonms/api/cms/common/fee-schedule/test
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2023-07-13T06:36:22.518+00:00'
                path: /cmscommonms/api/cms/common/fee-schedule/DME
                status: 500
                error: Internal Server Error
                requestId: e36d239e-324
      security:
      - bearerAuth: []
    servers:
    - url: /v1/cmscommonms
