openapi: 3.2.0
info:
  title: Optum Not Otherwise Classified (NOC) Drug Pricing APIs API
  version: v1.0
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  description: 'Operations tagged Not Otherwise Classified (NOC) Drug Pricing APIs across 2 of this provider''s published API definitions: optum-cms-common-facility-openapi.yml, optum-cms-common-physician-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1/cmscommonms
tags:
- name: Not Otherwise Classified (NOC) Drug Pricing APIs
paths:
  /api/cms/common/noc/pricing-list:
    get:
      tags:
      - Not Otherwise Classified (NOC) Drug Pricing APIs
      summary: Fetches NOC pricing list
      operationId: getNocDrugPriceList
      parameters:
      - name: sort
        in: query
        description: Any of these (code,-code,ndc,-ndc,genericName,-genericName,dosage,-dosage,pay,-pay,notes,-notes) are allowed values, default is +code
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - code
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: Fetch NOC pricing list
          content:
            application/json:
              example:
                content:
                - code: J3410
                  ndc: '00641602110'
                  genericName: Famotidine
                  dosage: 10 MG
                  pay: '.417'
                  notes: null
                - code: J3490
                  ndc: '00003256016'
                  genericName: Aztreonam
                  dosage: 500 MG
                  pay: '14.775'
                  notes: null
                totalCount: 145
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                timestamp: '2023-07-14T06:37:03.741+00:00'
                status: 404
                error: Not Found
                message: Not Found
                path: /cmscommonms/api/cms/common/noc/pricing-list1
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                timestamp: '2023-07-13T06:36:22.518+00:00'
                path: /cmscommonms/api/cms/common/noc/pricing-list
                status: 500
                error: Internal Server Error
                requestId: e36d239e-324
      security:
      - bearerAuth: []
    servers:
    - url: /v1/cmscommonms
components:
  schemas:
    Notification:
      type: object
      properties:
        error:
          type: array
          items:
            type: string
        warning:
          type: array
          items:
            type: string
        info:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- optum-cms-common-facility-openapi.yml
- optum-cms-common-physician-openapi.yml
x-readme:
  explorer-enabled: true
  proxy-enabled: true
