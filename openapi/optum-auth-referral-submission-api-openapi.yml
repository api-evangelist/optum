openapi: 3.0.0
info:
  description: The GraphQL Auth Referral Submission API allows users to search for providers, submit referrals,
    search referrals, and search prior authorizations using GraphQL queries and mutations.
  title: Auth Referral Submission API
  version: 1.0.0
servers:
- url: https://sandbox-apigw.optum.com
paths:
  /oihub/patient/auth/referral/v1:
    post:
      security:
      - oAuth:
        - read_healthcheck
      operationId: authReferralSubmission
      tags:
      - Auth Referral Submission
      parameters:
      - name: providerTaxId
        in: header
        description: Provider Tax ID Number
        required: true
        schema:
          example: '123456789'
          type: string
      - name: x-optum-consumer-correlation-id
        in: header
        description: Unique UUID to track the transaction
        required: false
        schema:
          example: 4d4a8964-e5fa-42dc-a37d-12345789
          type: string
      - name: environment
        in: header
        description: Environment
        required: false
        schema:
          example: sandbox
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              description: GraphQL queries/mutations for Auth Referral Submission
              properties:
                query:
                  description: GraphQL query or mutation
                  type: string
                variables:
                  description: Variables for the GraphQL query/mutation
                  type: object
                  properties:
                    providerSearchInput:
                      properties:
                        searchType:
                          description: REQUESTING,SERVICING
                          example: SERVICING
                          type: string
                        provider:
                          $ref: '#/components/schemas/ProviderInput'
                        patient:
                          $ref: '#/components/schemas/PatientInput'
                        pagination:
                          $ref: '#/components/schemas/PaginationInput'
                        payerId:
                          description: payerId
                          example: '87726'
                          type: string
                      type: object
                      required:
                      - searchType
                      - provider
                      - patient
                      - payerId
                    referralSubmitInput:
                      properties:
                        requestingProvider:
                          $ref: '#/components/schemas/ReferralSubmitProviderInput'
                        patient:
                          $ref: '#/components/schemas/PatientInput'
                        service:
                          $ref: '#/components/schemas/ServiceInput'
                        servicingProvider:
                          description: Servicing provider information
                          $ref: '#/components/schemas/ReferralSubmitProviderInput'
                        payerId:
                          description: payerId
                          example: '87726'
                          type: string
                      type: object
                      required:
                      - requestingProvider
                      - patient
                      - service
                      - servicingProvider
                      - payerId
                    referralSearchInput:
                      properties:
                        patient:
                          $ref: '#/components/schemas/PatientInput'
                        serviceStartDate:
                          example: '2024-01-01'
                          type: string
                        serviceEndDate:
                          example: '2024-12-31'
                          type: string
                        status:
                          description: 'default: APPROVED'
                          example: ALL
                          type: string
                        pagination:
                          $ref: '#/components/schemas/PaginationInput'
                        payerId:
                          description: payerId
                          example: '87726'
                          type: string
                      type: object
                      required:
                      - patient
                      - serviceStartDate
                      - serviceEndDate
                      - payerId
                    priorAuthSearchInput:
                      properties:
                        serviceReferenceNumber:
                          description: PriorAuth unique case Id reference number.
                          example: AXXXXXX
                          type: string
                        corporateTin:
                          description: Corporate Tax Identification Number.
                          example: '123456789'
                          type: string
                        provider:
                          $ref: '#/components/schemas/PriorAuthSearchProviderInput'
                        member:
                          $ref: '#/components/schemas/PatientInput'
                        serviceSetting:
                          description: Filter by service setting type.
                          example: Inpatient
                          type: string
                        status:
                          description: Filter by case status.
                          example: Open
                          type: string
                        startDate:
                          description: Start date for the service period search (YYYY-MM-DD). Default
                            will be current date.
                          example: '2025-07-19'
                          type: string
                        endDate:
                          description: End date for the service period search (YYYY-MM-DD). Default will
                            be current date.
                          example: '2025-10-17'
                          type: string
                        payerId:
                          description: payerId
                          example: '87726'
                          type: string
                      type: object
                      required:
                      - corporateTin
                      - provider
                      - member
                      - payerId
                operationName:
                  description: Name of the GraphQL operation to execute (optional)
                  type: string
            examples:
              SearchProviders:
                summary: Search Providers
                value:
                  query: 'query SearchProviders($providerSearchInput: ProviderSearchInput!) { searchProviders(providerSearchInput:
                    $providerSearchInput) { providers { name firstName middleName lastName providerOrganizationName
                    npi taxId contactName phoneNumber fax networkStatus address { addressLine1 addressLine2
                    city state zip zip4 } uniqueProviderIdentifier providerType providerSpeciality { code
                    description } gender distance handicapAccessible } pagination { totalRecords nextPageToken
                    } } }'
                  variables:
                    providerSearchInput:
                      searchType: SERVICING
                      provider:
                        zip: '90210'
                        radius: 50
                        firstName: Dr. Carlos
                        lastOrOrgName: Rodriguez
                        npi: '9876543210'
                        taxId: '987654321'
                        preferredLanguage: SPA
                        specialityCode: CARD
                        gender: M
                      patient:
                        firstName: Alice
                        lastName: Johnson
                        id: '1234567890'
                        dateOfBirth: '1990-12-31'
                        groupNumber: GRP321
                      pagination:
                        nextPageToken: '2'
                      payerId: '87726'
                  operationName: SearchProviders
              SubmitReferral:
                summary: Submit Referral
                value:
                  query: 'mutation SubmitReferral($referralSubmitInput: ReferralSubmitInput!) { submitReferral(referralSubmitInput:
                    $referralSubmitInput) { referralId referralStatus payer { id name messages } requestingProvider
                    { name firstName middleName lastName providerOrganizationName npi taxId contactName
                    phoneNumber fax networkStatus address { addressLine1 addressLine2 city state zip zip4
                    } } servicingProvider { name firstName middleName lastName providerOrganizationName
                    npi taxId contactName phoneNumber fax networkStatus address { addressLine1 addressLine2
                    city state zip zip4 } } patient { id firstName middleName lastName dateOfBirth groupNumber
                    relationshipCode relationshipDesc } decisions { decisionType certificationAction reviewDecisionReason
                    startDate endDate referralQuantity { quantity qualifier qualifierDesc remaining }
                    } x12Response rejectionReasons { rejectionLevel reasonDescription rejectionCode followUpAction
                    rejectionReason validRequestIndicator } } }'
                  variables:
                    referralSubmitInput:
                      requestingProvider:
                        npi: '1234567890'
                        taxId: '98765432'
                        zip: '90201'
                        firstName: Carlos
                        lastOrOrgName: Dr. Carlos Clinic
                        specialityCode: CARD
                        gender: M
                        city: Healthcare City
                        state: CA
                        radius: 50
                        contactName: Carlos Benito
                        phoneNumber: 555-222-3333
                        preferredLanguage: SPA
                      patient:
                        firstName: Alice
                        lastName: Johnson
                        id: '1234567890'
                        dateOfBirth: '1990-12-31'
                        groupNumber: GRP321
                      service:
                        diagnosisCodes:
                        - M79.3
