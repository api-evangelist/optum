                  operationName: SubmitReferral
              SearchReferrals:
                summary: Search Referrals
                value:
                  query: 'query SearchReferrals($referralSearchInput: ReferralSearchInput!) { searchReferrals(referralSearchInput:
                    $referralSearchInput) { referrals { referralId referralStatus referralStatusCode requestingProvider
                    { name firstName middleName lastName providerOrganizationName npi taxId contactName
                    phoneNumber fax networkStatus address { addressLine1 addressLine2 city state zip zip4
                    } providerSpeciality { code description } } servicingProvider { name firstName middleName
                    lastName providerOrganizationName npi taxId contactName phoneNumber fax networkStatus
                    address { addressLine1 addressLine2 city state zip zip4 } providerSpeciality { code
                    description } } service { diagnosisCodes referralQuantity { quantity qualifier qualifierDesc
                    remaining } startDate endDate comment } rejectionResponse { rejectionLevel reasonDescription
                    rejectionCode followUpAction rejectionReason validRequestIndicator } } pagination
                    { totalRecords nextPageToken } } }'
                  variables:
                    referralSearchInput:
                      patient:
                        firstName: Alice
                        lastName: Johnson
                        id: '1234567890'
                        dateOfBirth: '1990-12-31'
                        groupNumber: GRP321
                      serviceStartDate: '2024-01-01'
                      serviceEndDate: '2024-12-31'
                      status: ALL
