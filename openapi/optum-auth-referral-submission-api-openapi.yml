                        nextPageToken: '2'
                      payerId: '87726'
                  operationName: SearchReferrals
              SearchPriorAuths:
                summary: Search Prior Auths
                value:
                  query: 'query SearchPriorAuths($priorAuthSearchInput: PriorAuthSearchInput!) { searchPriorAuths(priorAuthSearchInput:
                    $priorAuthSearchInput) { caseSummary { serviceReferenceNumber memberID memberFirstName
                    memberLastName serviceSetting placeOfService serviceDates caseStatus overallCoverageStatus
                    } caseDescription { caseSearchMessages caseDetail { serviceReferenceNumber caseStatus
                    caseStatusReason primaryCarePhysician advanceNotifyDateTime admissionNotifyDateTime
                    expectedServiceStartDate expectedServiceEndDate actualServiceStartDate actualServiceEndDate
                    } coverageStatus { overallCoverageStatus procedureCode description coverageStatus
                    decisionDate geneticMolecularTestCode geneticMolecularTestReviewType } clinicalNotes
                    { createdTime createdBy noteText } patientDetails { id firstName middleName lastName
                    dateOfBirth groupNumber relationshipCode relationshipDesc product effectiveDate terminationDate
                    insuranceType verbalLanguagePreference writtenLanguagePreference informationalMessage
                    } submittingProvider { name firstName middleName lastName providerOrganizationName
                    npi taxId contactName phoneNumber fax networkStatus address { addressLine1 addressLine2
                    city state zip zip4 } } admittingAttendingProvider { name firstName middleName lastName
                    providerOrganizationName npi taxId contactName phoneNumber fax networkStatus address
                    { addressLine1 addressLine2 city state zip zip4 } } orderingProvider { name firstName
                    middleName lastName providerOrganizationName npi taxId contactName phoneNumber fax
                    networkStatus address { addressLine1 addressLine2 city state zip zip4 } } facilityDetails
                    { name firstName middleName lastName providerOrganizationName npi taxId contactName
