                        preferredLanguage: SPA
                      patient:
                        firstName: Alice
                        lastName: Johnson
                        id: '1234567890'
                        dateOfBirth: '1990-12-31'
                        groupNumber: GRP321
                      service:
                        diagnosisCodes:
                        - M79.3
                        referralQuantity:
                          quantity: 10
                          qualifier: VS
                        startDate: '2025-01-01'
                        endDate: '2025-01-01'
                        comment: Patient requires physical therapy for knee pain
                      servicingProvider:
                        npi: '1234567890'
                        taxId: '98765432'
                        zip: '90201'
                        firstName: Carlos
