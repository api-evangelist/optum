                    } } servicingProvider { name firstName middleName lastName providerOrganizationName
                    npi taxId contactName phoneNumber fax networkStatus address { addressLine1 addressLine2
                    city state zip zip4 } } patient { id firstName middleName lastName dateOfBirth groupNumber
                    relationshipCode relationshipDesc } decisions { decisionType certificationAction reviewDecisionReason
                    startDate endDate referralQuantity { quantity qualifier qualifierDesc remaining }
                    } x12Response rejectionReasons { rejectionLevel reasonDescription rejectionCode followUpAction
                    rejectionReason validRequestIndicator } } }'
                  variables:
