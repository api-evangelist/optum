components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ncc_auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://idx.linkhealth.com/auth
          tokenUrl: https://idx.linkhealth.com/auth/token
          scopes:
            scope-1: required scope for API access
  schemas:
    PlaceOrderRequest:
      type: object
      required:
      - tenantId
      - clientOrgId
      - campaignId
      - requestingPartyId
      - rosterFilePath
      - clientOrderName
      - serviceStartDate
      - serviceEndDate
      - vendors
      properties:
        tenantId:
          type: integer
          format: int64
        clientOrgId:
          type: integer
          format: int64
        campaignId:
          type: integer
          format: int64
          description: Campaign ID to place order. Either one of campaignId or campaignName is required
        campaignName:
          type: string
          description: Campaign name to place order. Either one of campaignId or campaignName is required
        requestingPartyId:
          type: integer
          format: int64
          description: Requesting party ID to place order. Either one of requestingPartyId or requestingPartyName
            is required
        requestingPartyName:
          type: string
          description: Requesting party name to place order. Either one of requestingPartyId or requestingPartyName
            is required
        rosterFilePath:
          type: string
        clientOrderName:
          type: string
        serviceStartDate:
          type: string
          format: date-time
        serviceEndDate:
          type: string
          format: date-time
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
    clientOrderRequest:
      type: object
      required:
      - vendorType
      - tenantId
      - clientOrgId
      - campaignId
      - requestingPartyId
      - rosterFilePath
      - clientOrderName
      - serviceStartDate
      - serviceEndDate
      - vendors
      properties:
        vendorType:
          type: string
          description: Type of the vendor for which the order is placed. It can be either external or
            internal and should not have any other value.
        tenantId:
          type: integer
          format: int64
          description: NCC tenant ID for which the order is to be placed.
        clientOrgId:
          type: integer
          format: int64
          description: NCC Client org ID for which the order is to be placed.
        campaignId:
          type: integer
          format: int64
          description: Campaign ID to place order. Either one of campaignId or campaignName is required.
            If both are present, then preference will be given to campaign ID.
        campaignName:
          type: string
          description: Campaign name to place order. Either one of campaignId or campaignName is required.
            If both are present, then preference will be given to campaign ID.
        requestingPartyId:
          type: integer
          format: int64
          description: Requesting party ID to place order. Either one of requestingPartyId or requestingPartyName
            is required. If both are present, then preference will be given to requestingPartyId.
        requestingPartyName:
          type: string
          description: Requesting party name to place order. Either one of requestingPartyId or requestingPartyName
            is required. If both are present, then preference will be given to requestingPartyId.
        rosterFilePath:
          type: string
          description: The file path of ABS where the roster file is present. Roster file should be available
            at this location before placing the request.
        clientOrderName:
          type: string
          description: Unique name of the client order to be created.
        serviceStartDate:
          type: string
          format: date
          description: Service start date.
        serviceEndDate:
          type: string
          format: date
          description: Service end date.
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
    Vendor:
      type: object
      required:
      - vendorOrgId
      - interfaces
      properties:
        vendorOrgId:
          type: integer
          format: int64
          description: Data vendor org ID.
        vendorName:
          type: string
          description: Data vendor name.
        interfaces:
          type: array
          description: List of MODXI interfaces to process order.
          items:
            type: string
        subVendorNames:
          type: array
          description: List of internal vendor emr names for placing an order for internal vendor. There
            should not be any sub vendor names specified for external vendor.
          items:
            type: string
    PlaceOrderResult:
      type: object
      properties:
        clientOrderId:
          type: integer
          format: int64
          description: Client order identifier for reference
        statusMessage:
          type: string
          description: status message for client order.
        clientOrderStatus:
          type: string
          enum:
          - ORDER_ACCEPTED
          - VALIDATION_ERRORS
          - AUTHORIZATION_FAILURE
    clientOrderResult:
      type: object
      properties:
        clientOrderId:
          type: integer
          format: int64
          description: Client order identifier for reference
        statusMessage:
          type: string
          description: status message for client order.
        clientOrderStatus:
          type: string
          enum:
          - ORDER_ACCEPTED
          - VALIDATION_ERRORS
          - AUTHORIZATION_FAILURE
    ApiResponseClientOrderDetailsResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        statusMessage:
          type: string
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
        result:
          $ref: '#/components/schemas/ClientOrderDetailsResponse'
    ClientOrderDetailsResponse:
      type: object
      properties:
        clientOrderId:
          type: integer
          format: int64
        clientOrderSubmittedDate:
          type: string
          format: date-time
        clientOrderStatus:
          type: string
        clientOrderStatusDetail:
          type: string
        vendorOrders:
          type: array
          items:
            $ref: '#/components/schemas/VendorOrder'
    OrderMetric:
      type: object
      properties:
        count:
          type: integer
          format: int32
        downloadUrl:
          type: string
    OrderResult:
      type: object
      properties:
        cleanMetric:
          $ref: '#/components/schemas/OrderMetric'
        errorMetric:
          $ref: '#/components/schemas/OrderMetric'
        duplicateMetric:
          $ref: '#/components/schemas/OrderMetric'
    VendorOrder:
      type: object
      properties:
        vendorOrgId:
          type: integer
          format: int32
        vendorOrgName:
          type: string
        vendorOrderId:
          type: integer
          format: int64
        vendorOrderStatus:
          type: string
        vendorOrderStatusDetail:
          type: string
        orderResult:
          $ref: '#/components/schemas/OrderResult'
    ApiResponseVendorOrderDetailsResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        statusMessage:
          type: string
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
        result:
          $ref: '#/components/schemas/VendorOrderDetailsResponse'
    VendorOrderDetailsResponse:
      type: object
      properties:
        clientOrderId:
          type: integer
          format: int64
        vendorOrderId:
          type: integer
          format: int64
        vendorOrgId:
          type: integer
          format: int64
        vendorOrgName:
          type: string
        vendorOrderStatus:
          type: string
        vendorOrderStatusDetail:
          type: string
        submissionDate:
          type: string
          format: date-time
        vendorOrderExpDate:
          type: string
          format: date-time
        newExpirationDate:
          type: string
          format: date-time
    ApiResponseClientOrderStatusResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        statusMessage:
          type: string
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
        result:
          $ref: '#/components/schemas/ClientOrderStatusResponse'
    ClientOrderStatusResponse:
      type: object
      properties:
        clientOrderId:
          type: integer
          format: int64
        clientOrderStatus:
          type: string
        clientOrderStatusDetail:
          type: string
    ApiResponseVendorOrderStatusResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        statusMessage:
          type: string
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
        result:
          $ref: '#/components/schemas/VendorOrderStatusResponse'
    VendorOrderStatusResponse:
      type: object
      properties:
        clientOrderId:
          type: integer
          format: int64
        vendorOrderId:
          type: integer
          format: int64
        vendorOrderStatus:
          type: string
        vendorOrderStatusDetail:
          type: string
    ApiResponsePlaceOrderResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        statusMessage:
          type: string
        result:
          $ref: '#/components/schemas/PlaceOrderResult'
    ApiResponseClientOrderResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        statusMessage:
          type: string
        result:
          $ref: '#/components/schemas/clientOrderResult'
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Error:
      type: object
      properties:
        status:
          type: string
        detail:
          $ref: '#/components/schemas/ErrorDetail'
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        statusMessage:
          type: string
        error:
          $ref: '#/components/schemas/Error'
    PackageInfo:
      type: object
      properties:
        vendorRequestUuid:
          type: string
          format: uuid
          example: 48692046-d403-4da9-a14b-f234b5f63f33
        vendorPackageId:
          type: string
          example: 486113551_48692046-d403-4da9-a14b-f234b5f63f33_3313f8f8-6f5b-41da-9c70-0bb233a3100f
        uniqueMemberId:
          type: string
          example: '486113551'
        vendorName:
          type: string
          example: Athena
        clientMemberTrackerIds:
          type: object
          properties:
            clientTrackingId1:
              type: string
              example: '2667278'
            clientTrackingId2:
              type: string
              example: ''
            clientTrackingId3:
              type: string
              example: ''
        vendorPackage:
          type: object
          properties:
            fileName:
              type: string
              example: athena_52075876128_89712.xml
            receivedDateTime:
              type: string
              format: date-time
              example: '2023-08-24T10:17:19'
            status:
              type: string
              example: ACCEPTED
            statusDetails:
              type: string
              example: ACCEPTED
        nccPackage:
          type: object
          properties:
            fileName:
              type: string
              example: NCC_Athena_48692046-d403-4da9-a14b-f234b5f63f33_733256_20230824101735.zip
            sentDateTime:
              type: string
              format: date-time
              example: '2023-08-24T10:17:19'
    ApiResponseProviderParticipationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            totalNoOfRecords:
              type: integer
              format: int64
              description: Total number of records available
            pageSize:
              type: integer
              format: int32
              description: Maximum number of records per page
            pageNumber:
              type: integer
              format: int32
              description: Current page number
            providerParticipation:
              type: array
              items:
                $ref: '#/components/schemas/ProviderParticipation'
        status:
          type: string
          description: HTTP Response Status
          example: success
        message:
          type: string
          description: Returns 'VENDOR MATCHED' message if records are found, otherwise 'NO VENDOR MATCHED'
          enum:
          - VENDOR MATCHED
          - NO VENDOR MATCHED
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
    ProviderParticipation:
      type: object
      properties:
        vendor_orgId:
          type: string
        vendorName:
          type: string
          description: Vendor name. Possible values are Athena, Veradigm, Moxe, EPP etc.
        emrInternalOrgs:
          type: array
          items:
            type: object
            properties:
              emr_id:
                type: string
              emr:
                type: string
              providerInfo:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderInfo'
    ProviderInfo:
      type: object
      properties:
        provider_infoId:
          type: string
        provider_tin:
          type: string
        provider_npi:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        provider_orgName:
          type: string
        provider_orgState:
          type: string
        provider_orgZip:
          type: string
        facility_name:
          type: string
        facility_npi:
          type: string
        facility_tin:
          type: string
        facility_state:
          type: string
        facility_zip:
          type: string
        creationDateTime:
          type: string
          format: date-time
        updatedDateTime:
          type: string
          format: date-time
        activeStartDate:
          type: string
          format: date
        activeEndDate:
          type: string
          format: date
        lastOptOutDate:
          type: string
          format: date
        optInStartDate:
          type: string
          format: date
        optInEndDate:
          type: string
          format: date
