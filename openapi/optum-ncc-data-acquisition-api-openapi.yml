      description: To fetch provider details in NCC, please use /findProviders legacy API. Either TIN
        or NPI is required.
      operationId: findProviders
      parameters:
      - name: tin
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: npi
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: requestType
        in: query
        required: false
        schema:
          type: string
          enum:
          - OR
          - AND
          - AND/OR
      - name: pageNo
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: tenantId
        in: header
        required: true
        schema:
          type: integer
          format: int64
      - name: clientOrgId
        in: header
        required: true
        schema:
          type: integer
          format: int64
      - name: acceptEncoding
        in: header
        required: true
        schema:
          type: string
          example: gzip
      security:
      - ncc_auth:
        - scope-1
