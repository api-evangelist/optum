  /rm/package-transaction:
    get:
      tags:
      - Roster Management
      summary: Track a Data Package
      description: Track a Data Package using the Vendor Request UUID and the Vendor Package ID
      operationId: trackPackage
      parameters:
      - in: query
        name: vendorPackageId
        required: true
        schema:
          type: string
        description: Unique ID identifying a package. See vendor specific details [URL].
      - in: query
        name: vendorRequestUuid
        schema:
          type: string
        description: Vendor Request UUID to which the package is associated. **Required if *vendorOrderId*
          not present.**
      - in: query
        name: vendorOrderId
        schema:
          type: string
        description: Vendor Order ID to which the package is associated. **Required if *vendorRequestUuid*
          not present.**
      - in: header
        name: tenantId
        required: true
        schema:
          type: string
      - in: header
        name: clientOrgId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation. Package Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageInfo'
              examples:
                packageInfo:
                  value:
                    status: 200
                    statusMessage: SUCCESS
                    result:
                      vendorRequestUuid: 48692046-d403-4da9-a14b-f234b5f63f33
                      vendorPackageId: 486113551_48692046-d403-4da9-a14b-f234b5f63f33_3313f8f8-6f5b-41da-9c70-0bb233a3100f
                      uniqueMemberId: 486113551
                      vendorName: Athena
                      clientMemberTrackerIds:
                        clientTrackingId1: id1
                        clientTrackingId2: id2
                        clientTrackingId3: id3
                      vendorPackage:
                        fileName: athena_52075876128_89712.xml
                        receivedDateTime: '2023-10-01T12:00:00Z'
                        status: ACCEPTED
                        statusDetails: ACCEPTED
                      nccPackage:
                        fileName: NCC_Athena_48692046-d403-4da9-a14b-f234b5f63f33_733256_20230824101735.zip
                        sentDateTime: '2023-10-01T12:05:00Z'
        '400':
          description: Missing required query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                Missing Vendor Package ID:
                  value:
                    status: 400
                    statusMessage: Bad Request
                    error:
                      status: FAILED
                      detail:
                        code: Bad Request
                        message: Required String parameter 'vendorPackageId' is not present
                Missing Vendor Request UUID and Vendor Order ID:
                  value:
                    status: FAILED
                    error:
                      code: API_ERROR_INVALID_REQUEST
                      message: Request param 'vendorRequestUuid' or 'vendorOrderId' needs to be present
        '404':
          description: Package not found with the provided input details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                Not Found:
                  value:
                    status: FAILED
                    error:
                      code: API_ERROR_NOT_FOUND
                      message: Package not found with provided detail
        '500':
          description: Something failed while searching for the package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                Internal Server Error:
                  value:
                    status: FAILED
                    error:
                      code: API_ERROR_OPERATION_FAILED
                      message: Something failed during the search of your package. Please try again.
  /om/v1/client-orders:
    post:
      summary: API to Place an order for internal and external vendors to NCC
      description: To place a new order to NCC, please use /v1/client-orders API. This API would need
        to have the pre-defined order components from the pre-requisite set up and the uploaded roster
        file to the defined ECG location.
      operationId: v1CreateClientOrder
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: 'ClientOrderRequest: Request object for the client-orders api, please see schema
          for details'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/clientOrderRequest'
            examples:
              clientOrderRequest-external:
                value:
                  vendorType: external
                  clientOrgId: '2301320'
                  tenantId: '2300980'
                  clientOrderName: Test Order Name 001
                  serviceStartDate: '2023-06-01'
                  serviceEndDate: '2023-06-11'
                  vendors:
                  - vendorName: Athena
                    vendorOrgId: '2301025'
                    interfaces:
                    - 2.16.840.1.113883.3.2966.1000.1005.152.3.95
                  campaignId: 1084
                  campaignName: 2021 PRO-1QWERTY-11
                  requestingPartyId: 1074
                  requestingPartyName: Optum
                  rosterFilePath: quarantine/original-roster-20211215-203035-cleanroster-int123334567.csv
              clientOrderRequest-internal:
                value:
                  vendorType: internal
                  clientOrgId: '2301320'
                  tenantId: '2300980'
                  clientOrderName: Test Order Name 001
                  serviceStartDate: '2023-06-01'
                  serviceEndDate: '2023-06-10'
                  vendors:
                  - vendorOrgId: '201307'
                    vendorName: Ecdh
                    interfaces:
                    - 2.16.840.1.113883.3.2966.1000.1005.152.1.806
                    subVendorNames:
                    - Athena
                    - Veradigm
                  campaignId: 1084
                  campaignName: 2021 PRO-1QWERTY-11
                  requestingPartyId: 1074
                  requestingPartyName: Optum
                  rosterFilePath: quarantine/original-roster-20211215-203035-cleanroster-int123334567.csv
              clientOrderRequest-internalForAllSubVendors:
                value:
                  vendorType: internal
                  clientOrgId: '2301320'
                  tenantId: '2300980'
                  clientOrderName: Test Order Name 001
                  serviceStartDate: '2023-06-01'
                  serviceEndDate: '2023-06-10'
                  vendors:
                  - vendorOrgId: '201307'
                    vendorName: Ecdh
                    interfaces:
                    - 2.16.840.1.113883.3.2966.1000.1005.152.1.806
                  campaignId: 1084
                  campaignName: 2021 PRO-1QWERTY-11
                  requestingPartyId: 1074
                  requestingPartyName: Optum
                  rosterFilePath: quarantine/original-roster-20211215-203035-cleanroster-int123334567.csv
      responses:
        '200':
          description: Place Client Order Success Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClientOrderResponse'
              examples:
                clientOrderResponse:
                  value:
                    status: 200
                    result:
                      clientOrderId: 3000
                      clientOrderStatus: ORDER_ACCEPTED
                      statusMessage: CLIENT_ORDER_CREATED
        '400':
          description: Bad Request. Some issue in the properties supplied to the API. For example Invalid
            vendor details, special chars in client order name, invalid vendor type, roster file not present
            in ABS etc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                badRequest-fileNotPresent:
                  value:
                    status: 400
                    statusMessage: Bad Request
                    error:
                      status: FAILED
                      detail:
                        code: API_ERROR_INVALID_REQUEST
                        message: 'Error validating request: [The specified file quarantine/EiMP_members_Roster_Test_V2.csv
                          is not present in blob storage. Hence the request will be rejected.]'
        '401':
          description: User is unauthorized to access Place client order API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                unauthorized:
                  value:
                    status: 401
                    statusMessage: Unauthorized
                    error:
                      status: FAILED
                      detail:
                        code: AUTHENTICATION
                        message: Jwt expired at 2023-12-06T19:23:03Z
        '500':
          description: Application failed to place order in NCC, internal server error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                internalServerError:
                  value:
                    status: 500
                    statusMessage: Internal Server Error
      tags:
      - Order Management
