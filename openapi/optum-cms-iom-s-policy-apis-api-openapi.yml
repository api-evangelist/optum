openapi: 3.2.0
info:
  title: Optum CMS IOM's Policy APIs API
  version: v1.0
  contact:
    name: Ken Kracker
    email: ken.kracker@optum.com
  description: 'Operations tagged CMS IOM''s Policy APIs across 2 of this provider''s published API definitions: optum-cms-common-facility-openapi.yml, optum-cms-common-physician-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1/cmscommonms
tags:
- name: CMS IOM's Policy APIs
paths:
  /api/cms/{iomType}/iom-policy/{codeType}/{code}:
    get:
      tags:
      - CMS IOM's Policy APIs
      summary: 'Fetches CMS IOM policies '
      operationId: getCMSIOMSPolicies
      parameters:
      - name: codeType
        in: path
        required: true
        schema:
          type: string
          enum:
          - cpt
          - hcpcs
      - name: iomType
        in: path
        required: true
        schema:
          type: string
          enum:
          - physician
          - facility
      - name: code
        in: path
        required: true
        schema:
          type: string
        example: 90740
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 150
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: yyyy-MM-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-MM-dd
      responses:
        '200':
          description: 'Fetches CMS IOM policies '
          content:
            application/json:
              example:
                content:
                - policyId: '11546543'
                  policyName: 100-04,18,10.2.1
                  policyText: Healthcare Common Procedure Coding System (HCPCS) and Diagnosis Codes<br>Vaccines and their administration are reported using separate codes. The following codes are for reporting the vaccines only.
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                timestamp: '2023-10-20T06:37:03.741+00:00'
                status: 404
                error: Not Found
                message: Not Found
                path: /cmscommonms/api/cms/iom-policy/invalid
        '500':
          description: Interal server error
          content:
            application/json:
              example:
                timestamp: '2023-10-20T06:37:03.741+00:00'
                path: /cmscommonms/api/cms/iom-policy
                status: 500
                error: Internal Server Error
                requestId: e36d239e-324
      security:
      - bearerAuth: []
    servers:
    - url: /v1/cmscommonms
components:
  schemas:
    Notification:
      type: object
      properties:
        error:
          type: array
          items:
            type: string
        warning:
          type: array
          items:
            type: string
        info:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- optum-cms-common-facility-openapi.yml
- optum-cms-common-physician-openapi.yml
x-readme:
  explorer-enabled: true
  proxy-enabled: true
