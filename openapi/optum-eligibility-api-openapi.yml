  /oihub/dental/eligibility/preservice/v1:
    post:
      summary: Pre-Care Eligibility Check
      description: Performs eligibility verification for a member and provider.
      operationId: checkEligibility
      security:
      - bearerAuth: []
      tags:
      - Eligibility
      parameters:
      - name: environment
        in: header
        required: true
        schema:
          type: string
          example: sandbox
        description: Target environment
      - name: providerTaxId
        in: header
        required: true
        schema:
          type: string
          pattern: ^\d{9}$
          example: '123456789'
        description: 9-digit provider tax identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
            example:
              query: "query CheckEligibility($input: EligibilityInput!) {\n  checkEligibility(input: $input) {\n    eligibility {\n      eligibilityInfo {\n        trnId\n        policyStatus\n      }\n    }\n  }\n}\n"
              variables:
                input:
                  memberId: '0001234567'
                  firstName: ABC
                  lastName: EFGH
                  dateOfBirth: '1980-01-01'
                  serviceStartDate: '2024-01-01'
                  serviceEndDate: '2024-12-31'
                  coverageTypes:
                  - Medical
                  payerId: '87726'
                  providerFirstName: QWERT
                  providerLastName: XYZ
                  providerNPI: '1234567890'
      responses:
        '200':
          description: Eligibility response successfully processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityResponse_2'
        '400':
          description: Invalid or missing request fields
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks required scopes
        '500':
          description: Optum backend error
    servers:
    - url: https://sandbox-apigw.optum.com
components:
  schemas:
    RequestSubscriber:
      type: object
      properties:
        birthSequenceNumber:
          maxLength: 9
          minLength: 0
          pattern: ^[0-9]+$
          type: string
