                  - value: CCI_1 set to 1 FROM CCI_1 COMP
                    href: ''
                  - value: ANSWER BOOK set to 1 FROM ARTICLE CODE_X_ARTICLETYPR ID 3
                    href: ''
                  - value: ASC_INDICATOR SET FROM ASC_INDICATOR AND FED_REG
