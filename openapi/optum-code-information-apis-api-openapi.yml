          enum:
          - i9v1
          - i9v3
          - cpt
          - hcpcs
          - i10_cm
      - name: code
        in: path
        description: Code for which range is required
        required: true
        schema:
          type: string
        example: 804.45
      - name: rangeid
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: direction
        in: query
        required: false
        schema:
          type: string
      - name: yyyy-mm-dd
        in: header
        description: Date for which historical data is required
        required: false
        schema:
          type: string
          format: yyyy-mm-dd
