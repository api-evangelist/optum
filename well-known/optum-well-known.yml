  defect: >-
    111 of the 170 OpenAPI URLs advertised in Optum's own API catalog do not return a spec. They
    return HTTP 200 with the portal's HTML shell instead of application/vnd.oai.openapi+json — a
    soft-404. A machine following the catalog as specified gets a 200 and a document that is not an
    API description, with no way to tell from the status line that the entry is dead. Reported here
    as measured on 2026-08-14. The 59 URLs that DO resolve, deduplicated against the definitions
    reachable through the ReadMe reference pages, are the 59 specs saved in openapi/.
