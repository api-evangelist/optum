headline: >-
  Optum serves a real RFC 9727 API catalog. https://developer.optum.com/.well-known/api-catalog
  returns HTTP 200 application/linkset+json listing all eight developer-portal product lines, and
  each product line serves its own nested catalog naming the direct OpenAPI URL of every API it
  publishes. This is the single most valuable discovery artifact on the platform and nothing on the
  human-facing portal points at it — it was found by probing, not by reading the docs. Every
  OpenAPI in openapi/ was harvested through it.
hosts:
