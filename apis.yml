aid: optum
name: Optum
description: >-
  Optum, part of UnitedHealth Group, is a health services and technology company that
  operates one of the largest medical and pharmacy networks in the United States. Its
  developer platform (developer.optum.com) exposes RESTful, JSON- and X12 EDI-based
  healthcare APIs for eligibility verification, professional and institutional claims
  validation and submission, claim status, ERA/remittance reports, prior authorization,
  attachments, payer directory, dental pre-care and claims, pharmacy solutions, and
  FHIR-based Data Access and Interoperability (Patient Access) endpoints. APIs are
  secured with OAuth2 client-credentials bearer tokens over TLS 1.2+, with free sandbox
  access, interactive "Try It" documentation, and downloadable OpenAPI specifications.
