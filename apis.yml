- name: Optum Interoperability APIs (CMS Patient Access)
  description: >-
    Optum's payer-side CMS Interoperability and Patient Access (CMS-9115-F) surface — Patient Access,
    Provider Directory and Payer-to-Payer exchange for the Optum behavioral and physical health plans.
    The former developer.optum.com/dataaccessandinteroperability ReadMe project no longer resolves (every
    path returned the portal shell when probed on 2026-08-14); the developer information is now published
    as per-plan PDF packets on optum.com, so there is no machine-readable contract for this surface.
