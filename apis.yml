apis:
- name: Optum Medical Network Eligibility and Claims API
  description: >-
    RESTful, JSON and X12 EDI (270/271, 837, 276/277, 835) healthcare transaction APIs
    for real-time patient eligibility and coverage verification, professional and
    institutional claim validation and submission, claim status inquiry, ERA/claim
    responses and reports, prior authorization, attachments, and payer list lookup.
  humanURL: https://developer.optum.com/eligibilityandclaims
  baseURL: https://apigw.optum.com/medicalnetwork/
  tags:
  - Eligibility
  - Claims
  - Claim Status
  - ERA
  - Prior Authorization
  - X12
  properties:
  - type: APIReference
    url: https://developer.optum.com/eligibilityandclaims/reference/api-overview
  - type: GettingStarted
    url: https://developer.optum.com/eligibilityandclaims/docs/get-started-with-optum-api
  - type: Authentication
    url: https://developer.optum.com/eligibilityandclaims/docs/optum-security-and-authorization
- name: Optum Data Access and Interoperability (FHIR) API
  description: >-
    FHIR R4-based Patient Access and interoperability APIs (Endpoint, Procedure,
    DocumentReference, ObservationVitalSigns, Immunization, and related resources)
    supporting CMS interoperability and patient data access requirements.
  humanURL: https://developer.optum.com/dataaccessandinteroperability
  baseURL: https://apigw.optum.com/
  tags:
  - FHIR
  - Interoperability
  - Patient Access
- name: Optum Real for Dental API
  description: >-
    Real-time dental data exchange APIs for pre-care estimates, eligibility, claims
    submission and inquiry, attachments with image intelligence, and ERA, with GraphQL
    options for select operations.
  humanURL: https://developer.optum.com/optumreal-dental
  baseURL: https://apigw.optum.com/dentalnetwork/
  tags:
  - Dental
  - Eligibility
  - Claims
