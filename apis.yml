- name: Optum API Tools — Security and Authorization
  description: The platform OAuth2 token service. Security and Authorization v2 issues a one-hour JWT
    bearer token at /apip/auth/v2/token for the Medical Network and Dental APIs; v3 ("sentinel") issues
    one at /apip/auth/sntl/v1/token for the Optum Real oihub APIs. Both generations are live simultaneously.
  humanURL: https://developer.optum.com/apitools
  baseURL: https://apigw.optum.com/apip/auth/
