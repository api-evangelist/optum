aid: optum
name: Optum
description: 'Optum, part of UnitedHealth Group, is a health services and technology company that operates
  one of the largest medical, dental and pharmacy networks in the United States and runs the clearinghouse
  formerly known as Change Healthcare. Its developer platform (developer.optum.com) publishes eight product
  lines of RESTful JSON, native X12 EDI and HL7 FHIR R4 APIs: eligibility and coverage discovery, professional
  and institutional claim validation and submission, claim status, ERA/remittance reports, attachments,
  payer directory and outage feeds, prior authorization in both X12 278 and FHIR Da Vinci PAS/DTR/CRD
  form, provider access and bulk member match, dental pre-care estimates and claims, pharmacy formatting
  and submitter services, payer enrollment and document tracking, and Optum Insight Platform data, code-search
  and analytics services. Every API is secured with an OAuth2 client-credentials JWT bearer token over
  TLS 1.2+, with a free canned-response sandbox on a separate host. Optum also publishes an RFC 9727 API
  catalog at /.well-known/api-catalog, which is how the 59 OpenAPI documents in this repo were harvested.'
