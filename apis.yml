apis:
- name: Optum Real (Medical) API
  description: >-
    Optum Real point-of-care APIs on the oihub gateway: pre-service eligibility, claim pre-check, claim
    actions, claim inquiry, patient benefit check, document search, auth referral submission, plus HL7
    FHIR R4 Da Vinci implementations — Prior Authorization Support (PAS $submit/$inquire/$submit-attachment),
    Documentation Templates and Rules (DTR questionnaire package and adaptive $next-question), Coverage
    Requirements Discovery over CDS Hooks, and Provider Access with $bulk-member-match and $davinci-data-export.
  humanURL: https://developer.optum.com/optumreal-medical
  baseURL: https://apigw.optum.com/oihub/
  tags:
  - FHIR
  - Da Vinci
